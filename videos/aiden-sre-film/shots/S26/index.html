<!doctype html>
<html data-composition-variables='[{"id":"pass","type":"string","label":"Pass: bg|mid|fg|all","default":"all"},{"id":"mode","type":"string","label":"Edit: full|cut","default":"full"}]'>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_shared/tokens/brand.css">
<link rel="stylesheet" href="_shared/layers/layers.css">
<link rel="stylesheet" href="_shared/layers/ui.css">
<link rel="stylesheet" href="_shared/layers/type.css">
<style>
  @font-face { font-family: "Geist"; src: url("_shared/assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("_shared/assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
  body { margin: 0; font-family: "Geist", sans-serif; color: var(--sg-cream); }
  .sg-eyebrow .sg-mask { position: static; background: none; display: inline-block; overflow: hidden; }
  .qtile {
    position: absolute;
    width: 420px;
    height: 420px;
    box-sizing: border-box;
    background: var(--sg-panel);
    border: 2px solid var(--sg-hairline);
    border-radius: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    z-index: 2;
  }
  .qtile.is-dim { opacity: 0.3; }
  .qname, .qlabel, .slab-label, .pill {
    font-family: "Geist Mono", monospace;
    border-radius: 0;
  }
  .qname { font-size: 18px; line-height: 1.2; color: var(--sg-cream); }
  .qlabel {
    position: absolute;
    width: 640px;
    text-align: center;
    font-size: 18px;
    line-height: 1.2;
    color: var(--sg-cream);
    z-index: 4;
  }
  .slab {
    position: absolute;
    width: 1000px;
    height: 80px;
    box-sizing: border-box;
    background: var(--sg-panel);
    border: 1px solid var(--sg-hairline);
    border-radius: 0;
    z-index: 3;
  }
  .slab-label {
    position: absolute;
    left: 24px;
    top: 30px;
    font-size: 16px;
    line-height: 20px;
    letter-spacing: 0.06em;
    color: var(--sg-cream);
  }
  .pill {
    position: absolute;
    top: 24px;
    height: 32px;
    box-sizing: border-box;
    border: 1px solid var(--sg-hairline);
    color: var(--sg-mute);
    font-size: 16px;
    line-height: 30px;
    text-align: center;
  }
  .pill.is-lit { color: var(--sg-cyan); border-color: var(--sg-cyan); }
  .wires {
    position: absolute;
    left: 0;
    top: 0;
    overflow: visible;
    pointer-events: none;
    z-index: 1;
  }
  .wires path { fill: none; stroke: var(--sg-cyan); stroke-width: 1; }
  .token {
    position: absolute;
    left: 0;
    top: 0;
    width: 12px;
    height: 12px;
    background: var(--sg-cream);
    border-radius: 0;
    z-index: 6;
  }
</style>
<script src="_shared/vendor/gsap.min.js"></script>
<script src="_shared/build/data.js"></script>
</head>
<body>
<div id="root" data-composition-id="S26" data-width="1920" data-height="1080">
  <div id="S26-bg" class="pass pass-bg"></div>
  <div id="S26-mid" class="pass pass-mid"><div class="cam"></div></div>
  <div id="S26-fg" class="pass pass-fg"><div class="cam"></div></div>
</div>
<script type="module">
  import { applyCamera } from "./_shared/layers/camera.js";
  import { selectPass, shotData, cueT } from "./_shared/layers/shot.js";
  import { mountRibbons } from "./_shared/layers/ribbons.js";
  import { mountType } from "./_shared/layers/type.js";
  import { EASE } from "./_shared/tokens/motion.js";

  const ID = "S26";
  const DATA_ID = "S26";
  const TILE = 420;
  const GAP = 16;
  const STEP = TILE + GAP;
  const LEFT = 750;
  const TOP = 210;
  const SLAB_X = 460;
  const SLAB_Y = 888;
  const OS_Y = 984;
  const { pass, mode } = window.__hyperframes.getVariables();
  const { timing, cam } = shotData(DATA_ID, mode);
  const roots = selectPass(ID, pass);
  const bg = document.getElementById("S26-bg");
  const mid = document.querySelector("#S26-mid .cam");
  const fg = document.querySelector("#S26-fg .cam");
  const tl = gsap.timeline({ paused: true });

  document.getElementById("root").dataset.duration = String(timing.duration);
  const D = timing.duration;
  const hold = D - 0.8;

  mountRibbons(bg, {
    seed: 125,
    count: 16,
    modes: [{ t: 0, mode: "rail", opacity: 0.5 }],
  }).bind(tl, D);
  bg.querySelector("canvas").setAttribute("data-layout-allow-overflow", "");

  const quarters = [
    { name: "REMEDIATE", col: 0, row: 0, border: "var(--sg-cyan)", dim: false },
    { name: "BUILD", col: 1, row: 0, border: "var(--sg-violet)", dim: true },
    { name: "OPERATE", col: 0, row: 1, border: "var(--sg-amber)", dim: true },
    { name: "OBSERVE", col: 1, row: 1, border: "var(--sg-coral)", dim: true },
  ];
  quarters.forEach((q) => {
    const el = document.createElement("div");
    el.className = q.dim ? "qtile is-dim" : "qtile";
    el.style.left = (LEFT + q.col * STEP) + "px";
    el.style.top = (TOP + q.row * STEP) + "px";
    el.style.borderColor = q.border;
    if (q.dim) {
      const name = document.createElement("div");
      name.className = "qname";
      name.textContent = q.name;
      el.appendChild(name);
    }
    mid.appendChild(el);
  });
  const rem = quarters[0];
  const label = document.createElement("div");
  label.className = "qlabel";
  label.textContent = "REMEDIATE · Aiden for SRE";
  label.style.left = (LEFT + rem.col * STEP + TILE / 2 - 320) + "px";
  label.style.top = (TOP + rem.row * STEP + TILE + 14) + "px";
  mid.appendChild(label);

  const chipSpec = [
    { text: "deployed", left: 250, w: 150 },
    { text: "changed", left: 420, w: 140 },
    { text: "broke", left: 580, w: 120 },
    { text: "fixed", left: 720, w: 120 },
  ];
  const slab = document.createElement("div");
  slab.className = "slab";
  slab.dataset.key = "world-model";
  slab.style.left = SLAB_X + "px";
  slab.style.top = SLAB_Y + "px";
  const slabLabel = document.createElement("div");
  slabLabel.className = "slab-label";
  slabLabel.textContent = "AIDEN WORLD MODEL";
  slab.appendChild(slabLabel);
  chipSpec.forEach((spec) => {
    const el = document.createElement("div");
    el.className = "pill is-lit";
    el.textContent = spec.text;
    el.style.left = spec.left + "px";
    el.style.width = spec.w + "px";
    slab.appendChild(el);
  });
  mid.appendChild(slab);

  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "wires");
  svg.setAttribute("viewBox", "0 0 1920 1080");
  svg.setAttribute("width", "1920");
  svg.setAttribute("height", "1080");
  quarters.forEach((q) => {
    const x = LEFT + q.col * STEP;
    const y = TOP + q.row * STEP;
    let x1 = x + TILE / 2;
    let x2 = x1;
    const y1 = y + TILE;
    if (q.row === 0 && q.col === 0) { x1 = x; x2 = x - 14; }
    else if (q.row === 0) { x1 = x + TILE; x2 = x + TILE + 14; }
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", "M " + x1 + " " + y1 + " L " + x2 + " " + SLAB_Y);
    svg.appendChild(path);
  });
  mid.appendChild(svg);

  const os = document.createElement("div");
  os.className = "slab";
  os.dataset.key = "aiden-os";
  os.style.left = SLAB_X + "px";
  os.style.top = OS_Y + "px";
  os.setAttribute("data-layout-allow-overflow", "");
  const osLabel = document.createElement("div");
  osLabel.className = "slab-label";
  osLabel.textContent = "AIDEN OS";
  os.appendChild(osLabel);
  const tPolicy = cueT(timing, "policy");
  const pillSpec = [
    { text: "policy", left: 220, w: 140, t: tPolicy },
    { text: "approvals", left: 380, w: 170, t: tPolicy + 0.25 },
    { text: "audit", left: 570, w: 130, t: tPolicy + 0.5 },
  ];
  const pills = pillSpec.map((spec) => {
    const el = document.createElement("div");
    el.className = "pill";
    el.textContent = spec.text;
    el.style.left = spec.left + "px";
    el.style.width = spec.w + "px";
    os.appendChild(el);
    return el;
  });
  mid.appendChild(os);
  tl.fromTo(os, { x: 1200 }, { x: 0, duration: 0.7, ease: EASE.enter }, 0.1);

  pillSpec.forEach((spec, i) => {
    const dur = Math.min(0.12, Math.max(0.04, hold - spec.t));
    tl.to(pills[i], {
      color: "var(--sg-violet)",
      borderColor: "var(--sg-violet)",
      duration: dur,
      ease: EASE.snap,
    }, spec.t);
  });

  const policy = pills[0];
  const from = {
    x: LEFT + rem.col * STEP + TILE / 2 - 6,
    y: TOP + rem.row * STEP + TILE / 2 - 6,
  };
  const atPolicy = {
    x: SLAB_X + pillSpec[0].left + pillSpec[0].w / 2 - 6,
    y: OS_Y + 40 - 6,
  };
  const token = document.createElement("div");
  token.className = "token";
  token.setAttribute("data-layout-allow-overflow", "");
  mid.appendChild(token);
  gsap.set(token, { x: from.x, y: from.y, opacity: 0 });
  tl.set(token, { opacity: 1 }, 1.0);
  tl.to(token, { x: atPolicy.x, y: atPolicy.y, duration: tPolicy - 1.0, ease: "power2.inOut" }, 1.0);
  tl.to(policy, {
    color: "var(--sg-green)",
    borderColor: "var(--sg-green)",
    duration: 0.08,
    ease: "none",
  }, tPolicy);
  tl.to(token, { x: atPolicy.x, y: atPolicy.y, duration: 0.2, ease: "none" }, tPolicy);
  tl.to(policy, {
    color: "var(--sg-violet)",
    borderColor: "var(--sg-violet)",
    duration: 0.12,
    ease: EASE.snap,
  }, tPolicy + 0.08);
  tl.to(token, {
    x: atPolicy.x,
    y: 1160,
    duration: Math.max(0.05, hold - (tPolicy + 0.2)),
    ease: EASE.exit,
  }, tPolicy + 0.2);

  function settledEyebrow(text, x, y) {
    const root = document.createElement("div");
    root.className = "sg-eyebrow";
    root.setAttribute("data-layout-allow-overlap", "");
    root.setAttribute("aria-label", text);
    root.style.left = x + "px";
    root.style.top = y + "px";
    const rule = document.createElement("span");
    rule.className = "sg-rule";
    root.appendChild(rule);
    const mask = document.createElement("span");
    mask.className = "sg-mask";
    mask.setAttribute("data-layout-allow-overflow", "");
    const word = document.createElement("span");
    word.className = "sg-rise";
    word.setAttribute("data-layout-allow-overlap", "");
    word.setAttribute("aria-hidden", "true");
    word.textContent = text;
    mask.appendChild(word);
    root.appendChild(mask);
    fg.appendChild(root);
    return root;
  }

  const previous = settledEyebrow("AIDEN WORLD MODEL", 120, 60);
  const type = mountType(fg);
  type.fromOst(tl, timing.ost, { eyebrow: { x: 120, y: 60 } });
  const next = fg.querySelectorAll(".sg-eyebrow")[1];
  next.setAttribute("data-layout-allow-overlap", "");
  next.querySelector(".sg-rise").setAttribute("data-layout-allow-overlap", "");
  const osT = cueT(timing, "AIDEN OS");
  gsap.set(next, { opacity: 0 });
  tl.to(previous, { opacity: 0, duration: 0.2, ease: "none" }, osT);
  tl.to(next, { opacity: 1, duration: 0.2, ease: "none" }, osT);

  applyCamera(tl, cam, roots, D);
  tl.set({}, {}, D);
  window.__timelines[ID] = tl;
  void pass;
</script>
</body>
</html>
