        <div id="f02-field"></div>

<script src="assets/frames/10/vendor/gsap.min.js"></script>
<script type="module">
  const ID = "02-alert-flood";
  const D = 7.96;
  const COLS = 13;
  const ROWS = 10;
  const TITLES = [
    ["High", "Auth Validation Latency High"],
    ["High", "Pod Crash Loop"],
    ["Medium", "System Load is High"],
    ["High", "API Request Latency High"],
  ];
  const HERO = 71;

  const field = document.getElementById("f02-field");
  const cards = [];
  for (let i = 0; i < COLS * ROWS; i++) {
    const col = i % COLS;
    const row = (i / COLS) | 0;
    const pair = i === HERO ? TITLES[0] : TITLES[i % TITLES.length];
    const el = document.createElement("div");
    el.className = "f02-card" + (i === HERO ? " f02-hero" : "");
    if (i !== HERO && i % 10 !== 1) el.classList.add("f02-noise");
    el.id = i === HERO ? "f02-hero" : "f02-card-" + i;
    const x = (col - 6) * 280 + (row % 2) * 16;
    const y = (row - 4.5) * 64;
    el.style.left = x + "px";
    el.style.top = y + "px";
    const kicker = document.createElement("div");
    kicker.className = "f02-card-kicker";
    kicker.textContent = pair[0];
    const title = document.createElement("div");
    title.className = "f02-card-title";
    title.textContent = pair[1];
    el.appendChild(kicker);
    el.appendChild(title);
    field.appendChild(el);
    cards.push(el);
  }

  const { mountRibbons } = await import(
    new URL("../../assets/frames/02/ribbons-mount.js", import.meta.url).href,
  );

  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  window.__timelines[ID] = tl;
  window.__timelines.main = tl;

  mountRibbons(document.getElementById("f02-ribbon-host"), {
    seed: 402,
    count: 24,
    split: 0.7,
    modes: [
      { t: 0, mode: "dormant", opacity: 0.5 },
      { t: 1.5, mode: "converge", opacity: 0.82, target: { x: 880, y: 500 } },
      { t: 4.2, mode: "rail", opacity: 0.64 },
    ],
  }).bind(tl, D);

  const cam = document.getElementById("f02-cam");
  const stage = document.getElementById("f02-stage");
  const counter = document.getElementById("f02-counter");
  const hero = document.getElementById("f02-hero");
  const blurNode = document.getElementById("f02-streak-blur");
  const blurProxy = { v: 0 };
  const writeBlur = () => blurNode.setAttribute("stdDeviation", `${blurProxy.v} ${blurProxy.v}`);
  writeBlur();

  const camState = { x: -40, y: 18, z: 40, s: 1.68 };
  function applyCamera() {
    cam.style.transform = `translate3d(${camState.x}px, ${camState.y}px, ${camState.z}px) scale(${camState.s})`;
  }
  applyCamera();

  gsap.set(stage, { rotationX: 8, rotationY: -6 });
  gsap.set(counter, { scale: 0.55 });

  tl.to(
    stage,
    { rotationX: 2, rotationY: -4, duration: 0.8, ease: "power4.out" },
    0.05,
  );

  const F = 1 / 60;
  const order = cards
    .map((el, i) => {
      const col = i % COLS;
      const row = (i / COLS) | 0;
      const dx = col - 6;
      const dy = row - 4.5;
      return { el, d: dx * dx + dy * dy + i * 0.0001 };
    })
    .sort((a, b) => a.d - b.d);

  let tCard = 0.1;
  order.forEach((item, n) => {
    let dur;
    let y0;
    let step;
    if (n < 8) {
      dur = 0.18 - n * 0.008;
      y0 = 76 - n * 4;
      step = dur - F;
    } else if (n < 28) {
      dur = 0.11;
      y0 = 46;
      step = 0.028;
    } else {
      dur = 0.08;
      y0 = 32;
      step = 0.008;
    }
    tl.set(item.el, { opacity: 1, y: y0 }, tCard);
    tl.to(item.el, { y: 0, duration: dur, ease: "power4.out" }, tCard);
    tCard += step;
  });

  const DOLLY_AT = 1.5;
  const DOLLY_DUR = 2.4;
  tl.fromTo(
    camState,
    { x: -40, y: 18, z: 40, s: 1.68 },
    {
      x: -16,
      y: 0,
      z: -80,
      s: 0.56,
      duration: DOLLY_DUR,
      ease: "power2.inOut",
      onUpdate: applyCamera,
    },
    DOLLY_AT,
  );
  tl.to(
    blurProxy,
    { v: 16, duration: DOLLY_DUR / 2, ease: "power2.in", onUpdate: writeBlur },
    DOLLY_AT,
  );
  tl.to(
    blurProxy,
    { v: 0, duration: DOLLY_DUR / 2, ease: "power2.out", onUpdate: writeBlur },
    DOLLY_AT + DOLLY_DUR / 2,
  );

  tl.to(
    camState,
    {
      x: -48,
      y: -16,
      z: -120,
      s: 0.5,
      duration: D - (DOLLY_AT + DOLLY_DUR),
      ease: "power1.inOut",
      onUpdate: applyCamera,
    },
    DOLLY_AT + DOLLY_DUR,
  );
  tl.to(
    stage,
    { rotationX: 2.4, rotationY: -4.5, duration: 3.6, ease: "sine.inOut" },
    4.2,
  );

  const countState = { value: 212 };
  tl.to(
    countState,
    {
      value: 1284,
      duration: 2.2,
      ease: "power3.out",
      onUpdate: () => {
        counter.textContent = Math.round(countState.value).toLocaleString("en-US");
      },
    },
    0.2,
  );
  tl.fromTo(
    counter,
    { scale: 0.55 },
    { scale: 1, duration: 2.2, ease: "power3.out" },
    0.2,
  );

  tl.to(
    ".f02-noise",
    { backgroundColor: "#1b1811", borderColor: "#2c2926", duration: 1.25, ease: "power2.out" },
    3.0,
  );
  tl.to(
    ".f02-noise .f02-card-title, .f02-noise .f02-card-kicker",
    { color: "#6d655c", duration: 1.25, ease: "power2.out" },
    3.0,
  );

  tl.to(hero, { scale: 1.16, duration: 0.26, ease: "power2.out" }, 6.33);
  tl.to(hero, { scale: 1, duration: 0.32, ease: "power2.inOut" }, 6.59);
  tl.to(hero, { scale: 1.08, duration: 0.28, ease: "power2.out" }, 6.91);
  tl.to(hero, { scale: 1.03, duration: 0.45, ease: "sine.out" }, 7.19);

  tl.to({}, { duration: D }, 0);
</script>
