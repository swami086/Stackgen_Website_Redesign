<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0c0e; }
      #root { width: 1920px; height: 1080px; position: relative; }
      #stage {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at 50% 30%, #16171c 0%, #0b0c0e 70%);
        display: flex; align-items: center; justify-content: center;
      }
      #card {
        width: 1760px; height: 990px; border-radius: 14px;
        background: #151619; border: 1px solid #2a2c33; overflow: hidden;
        display: flex; flex-direction: column;
      }
      #chrome {
        height: 40px; flex-shrink: 0; display: flex; align-items: center;
        padding: 0 14px; background: #151619; border-bottom: 1px solid #2a2c33;
      }
      .dots { display: flex; gap: 7px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #3a3d45; }
      #screen { flex: 1; position: relative; overflow: hidden; background: #0f1115; }
      #world {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        transform-origin: 0 0; will-change: transform;
      }
      #world video.ui {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        object-fit: cover; object-position: left top;
      }
      .tgt { position: absolute; opacity: 0; pointer-events: none; }
      #t-alert { left: 72px; top: 48px; width: 1180px; height: 160px; }
      #t-metrics { left: 72px; top: 260px; width: 1180px; height: 120px; }
      #t-conf { left: 620px; top: 268px; width: 220px; height: 100px; }
      #t-rca { left: 72px; top: 400px; width: 1180px; height: 220px; }
      #t-evidence { left: 1420px; top: 80px; width: 460px; height: 820px; }
      .hl {
        position: absolute;
        border: 4px solid #F5C518;
        outline: 3px solid rgba(0, 0, 0, 0.45);
        outline-offset: 3px;
        border-radius: 12px;
        pointer-events: none;
        opacity: 0;
        background: rgba(245, 197, 24, 0.12);
      }
      #hl-alert { left: 68px; top: 44px; width: 1188px; height: 168px; }
      #hl-metrics { left: 68px; top: 256px; width: 1188px; height: 128px; }
      #hl-conf { left: 616px; top: 264px; width: 228px; height: 108px; }
      #hl-rca { left: 68px; top: 396px; width: 1188px; height: 228px; }
      #hl-evidence { left: 1416px; top: 76px; width: 468px; height: 828px; }
      #vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.32) 100%);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <!--
      plate-stage — silent SCRIPT beats 4–5 (~22s). Solution: autopilot CoT + hypotheses.
      Source: stage-rca-tight (investigation trim). Camera: focusPoseSafe + yellow rings.
      Clueso owns Chris VO. No plate audio.
    -->
    <div id="root" data-composition-id="plate-stage" data-start="0" data-duration="22" data-width="1920" data-height="1080">
      <div id="stage">
        <div id="card">
          <div id="chrome"><div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
          <div id="screen" data-layout-allow-overflow>
            <div id="world" data-layout-allow-overflow>
              <video
                id="stage-rca-tight"
                class="ui clip"
                src="assets/stage-rca-tight-1920x1080.mp4"
                data-start="0"
                data-duration="22"
                data-media-start="0"
                data-track-index="0"
                muted
                playsinline
              ></video>
              <div class="tgt" id="t-alert"></div>
              <div class="tgt" id="t-metrics"></div>
              <div class="tgt" id="t-conf"></div>
              <div class="tgt" id="t-rca"></div>
              <div class="tgt" id="t-evidence"></div>
              <div class="hl" id="hl-alert"></div>
              <div class="hl" id="hl-metrics"></div>
              <div class="hl" id="hl-conf"></div>
              <div class="hl" id="hl-rca"></div>
              <div class="hl" id="hl-evidence"></div>
            </div>
            <div id="vignette"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const world = document.getElementById("world");
      const vignette = document.getElementById("vignette");
      const W = 1920, H = 1080, PAD = 72, IN = 1.05, OUT = 0.9;

      function clearHl() {
        document.querySelectorAll(".hl").forEach((el) => {
          gsap.killTweensOf(el);
          gsap.set(el, { opacity: 0, scale: 1 });
        });
      }
      function showHl(id) {
        clearHl();
        const el = document.getElementById(id);
        if (!el) return;
        gsap.fromTo(el, { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.32, ease: "power2.out" });
        gsap.to(el, { opacity: 0.88, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" });
      }

      function measureTarget(sel) {
        const el = document.querySelector(sel);
        void world.offsetWidth;
        const wr = world.getBoundingClientRect();
        const er = el.getBoundingClientRect();
        return { x: er.left - wr.left, y: er.top - wr.top, w: er.width, h: er.height };
      }

      function focusPoseSafe(m, desiredS) {
        const maxSx = (W - 2 * PAD) / m.w;
        const maxSy = (H - 2 * PAD) / m.h;
        const s = Math.min(desiredS, maxSx, maxSy, 1.42);
        let tx = W / 2 - s * (m.x + m.w / 2);
        let ty = H / 2 - s * (m.y + m.h / 2);
        const minTx = PAD - s * m.x;
        const maxTx = W - PAD - s * (m.x + m.w);
        const minTy = PAD - s * m.y;
        const maxTy = H - PAD - s * (m.y + m.h);
        tx = Math.min(minTx, Math.max(maxTx, tx));
        ty = Math.min(minTy, Math.max(maxTy, ty));
        return { x: tx, y: ty, scale: s };
      }

      function zoomCycle(pose, tIn, holdDur, outDur) {
        tl.to(world, { x: pose.x, y: pose.y, scale: pose.scale, duration: IN, ease: "power2.inOut" }, tIn);
        tl.to(vignette, { opacity: 0.5, duration: IN * 0.8, ease: "power1.out" }, tIn);
        const tOut = tIn + IN + holdDur;
        tl.to(world, { x: 0, y: 0, scale: 1, duration: outDur, ease: "power2.inOut" }, tOut);
        tl.to(vignette, { opacity: 0, duration: outDur * 0.9, ease: "power1.in" }, tOut);
      }

      gsap.set(world, { x: 0, y: 0, scale: 1, transformOrigin: "0 0" });
      gsap.set(vignette, { opacity: 0 });
      clearHl();

      const T = {
        alert: measureTarget("#t-alert"),
        metrics: measureTarget("#t-metrics"),
        conf: measureTarget("#t-conf"),
        rca: measureTarget("#t-rca"),
        evidence: measureTarget("#t-evidence"),
      };

      const tl = gsap.timeline({ paused: true });

      /* Beat 3–4: Aiden steps in / understands environment */
      tl.call(() => showHl("hl-alert"), null, 0.5);
      zoomCycle(focusPoseSafe(T.alert, 1.24), 0.6, 2.0, OUT);
      tl.call(() => showHl("hl-rca"), null, 4.4);
      zoomCycle(focusPoseSafe(T.rca, 1.26), 4.5, 2.2, 0.75);

      /* Beat 4–5: plugs into tools you already use → context */
      tl.call(() => showHl("hl-evidence"), null, 8.4);
      zoomCycle(focusPoseSafe(T.evidence, 1.30), 8.5, 2.6, 0.75);
      tl.call(() => showHl("hl-metrics"), null, 12.8);
      zoomCycle(focusPoseSafe(T.metrics, 1.28), 12.9, 1.6, 0.65);
      tl.call(() => showHl("hl-conf"), null, 16.0);
      zoomCycle(focusPoseSafe(T.conf, 1.34), 16.1, 2.0, 0.8);
      tl.call(clearHl, null, 21.0);

      window.__timelines = window.__timelines || {};
      window.__timelines["plate-stage"] = tl;
    </script>
  </body>
</html>
