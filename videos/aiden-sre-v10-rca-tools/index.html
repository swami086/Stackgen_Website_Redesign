<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0c0e; }
      #root { width: 1920px; height: 1080px; position: relative; }
      #stage {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at 50% 30%, #16171c 0%, #0b0c0e 70%);
        display: flex; align-items: center; justify-content: center;
      }
      #card {
        width: 1760px; height: 990px; border-radius: 14px;
        background: #151619; border: 1px solid #2a2c33; overflow: hidden;
        display: flex; flex-direction: column;
      }
      #chrome {
        height: 40px; flex-shrink: 0; display: flex; align-items: center;
        padding: 0 14px; background: #151619; border-bottom: 1px solid #2a2c33;
      }
      .dots { display: flex; gap: 7px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #3a3d45; }
      #screen { flex: 1; position: relative; overflow: hidden; background: #0f1115; }
      #world {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        transform-origin: 0 0; will-change: transform;
      }
      #world img.ui {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        object-fit: cover; object-position: left top;
      }
      #bed-dim {
        position: absolute; inset: 0; z-index: 4;
        background: rgba(8, 9, 12, 0.5); opacity: 0; pointer-events: none;
      }
      #slack-panel {
        position: absolute; left: 120px; top: 50px;
        width: 1680px; height: 945px; border-radius: 10px; overflow: hidden;
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 28px 90px rgba(0,0,0,0.65);
        opacity: 0; z-index: 5;
      }
      #slack-panel img {
        width: 100%; height: 100%; object-fit: cover; object-position: left top; display: block;
      }
      #msg-reveal {
        position: absolute; left: 520px; top: 160px; width: 980px; height: 220px;
        border-radius: 12px; z-index: 6; pointer-events: none;
        box-shadow: 0 0 0 0 rgba(124, 92, 255, 0);
        opacity: 0;
      }
      #cursor {
        position: absolute; left: 0; top: 0; width: 28px; height: 28px;
        z-index: 40; pointer-events: none; opacity: 0;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.45));
      }
      .ripple {
        position: absolute; width: 72px; height: 72px; border-radius: 50%;
        border: 2px solid rgba(124, 92, 255, 0.85);
        transform: translate(-50%, -50%) scale(0); opacity: 0; z-index: 39; pointer-events: none;
      }
      #vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 30;
        background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.32) 100%);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <!--
      plate-d — Scrubbed Slack #incidents (~18s). Message settle + cursor to evidence links.
    -->
    <div id="root" data-composition-id="plate-d" data-start="0" data-duration="18" data-width="1920" data-height="1080">
      <div id="stage">
        <div id="card">
          <div id="chrome"><div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
          <div id="screen" data-layout-allow-overflow>
            <div id="world" data-layout-allow-overflow>
              <img class="ui" src="assets/rca-card.png" alt="" />
              <div id="bed-dim"></div>
              <div id="slack-panel">
                <img src="assets/tool-slack.png" alt="" />
                <div id="msg-reveal"></div>
              </div>
              <div class="ripple" id="r1" style="left:780px;top:320px"></div>
              <svg id="cursor" viewBox="0 0 28 28" fill="none">
                <path d="M4 3l8.5 20.5 2.2-7.3L22 14.2 4 3z" fill="#fff" stroke="#1a1a1a" stroke-width="1.2"/>
              </svg>
            </div>
            <div id="vignette"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const world = document.getElementById("world");
      const vignette = document.getElementById("vignette");
      const bedDim = document.getElementById("bed-dim");
      const slack = document.getElementById("slack-panel");
      const msg = document.getElementById("msg-reveal");
      const cursor = document.getElementById("cursor");
      const r1 = document.getElementById("r1");

      gsap.set(world, { x: 0, y: 0, scale: 1, transformOrigin: "0 0" });
      gsap.set([vignette, bedDim], { opacity: 0 });
      gsap.set(slack, { opacity: 0, scale: 0.96 });
      gsap.set(msg, { opacity: 0, scale: 0.94 });
      gsap.set(cursor, { x: 600, y: 400, opacity: 0, scale: 1, transformOrigin: "4px 3px" });
      gsap.set(r1, { scale: 0, opacity: 0 });

      const tl = gsap.timeline({ paused: true });

      tl.to(vignette, { opacity: 0.25, duration: 0.5 }, 0.2);
      tl.to(bedDim, { opacity: 1, duration: 0.35 }, 0.9);
      tl.to(slack, { opacity: 1, scale: 1, duration: 0.55, ease: "power2.out" }, 1.0);
      // Message "lands" pulse
      tl.to(msg, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.4)" }, 1.6);
      tl.to(msg, { boxShadow: "0 0 0 8px rgba(124,92,255,0.18)", duration: 0.5 }, 1.7);
      tl.to(msg, { opacity: 0, duration: 0.4 }, 2.8);

      tl.to(cursor, { opacity: 1, duration: 0.25 }, 2.4);
      tl.to(cursor, { x: 760, y: 300, duration: 0.9, ease: "power2.inOut" }, 2.6);
      tl.to(world, { scale: 1.1, x: -70, y: -50, duration: 1.0, ease: "power2.inOut" }, 3.2);
      // Click evidence link
      tl.to(cursor, { scale: 0.86, duration: 0.08, yoyo: true, repeat: 1 }, 5.0);
      tl.set(r1, { opacity: 1 }, 5.05);
      tl.to(r1, { scale: 4.0, opacity: 0, duration: 0.65, ease: "power2.out", immediateRender: false }, 5.05);
      tl.to(cursor, { x: 880, y: 340, duration: 0.7, ease: "power1.inOut" }, 6.0);
      tl.to(cursor, { x: 1000, y: 340, duration: 0.7, ease: "power1.inOut" }, 7.2);
      tl.to(world, { scale: 1.14, x: -90, y: -70, duration: 0.9, ease: "power2.inOut" }, 8.0);
      tl.to(world, { scale: 1, x: 0, y: 0, duration: 0.9, ease: "power2.inOut" }, 13.5);
      tl.to(cursor, { opacity: 0.35, duration: 0.4 }, 15.0);

      window.__timelines = window.__timelines || {};
      window.__timelines["plate-d"] = tl;
    </script>
  </body>
</html>
