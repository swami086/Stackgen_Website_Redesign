<script>
(function () {
  "use strict";

  /* ── element refs ─────────────────────────────────────────── */
  var camera   = document.getElementById("f09-context-graph-camera");
  var chipN    = document.getElementById("f09-context-graph-chip-n");
  var chipE    = document.getElementById("f09-context-graph-chip-e");
  var chipS    = document.getElementById("f09-context-graph-chip-s");
  var chipW    = document.getElementById("f09-context-graph-chip-w");
  var connN    = document.getElementById("f09-context-graph-conn-n");
  var connE    = document.getElementById("f09-context-graph-conn-e");
  var connS    = document.getElementById("f09-context-graph-conn-s");
  var connW    = document.getElementById("f09-context-graph-conn-w");
  var ring     = document.getElementById("f09-context-graph-hub-ring");
  var hubLabel = document.getElementById("f09-context-graph-hub-label");
  var subline  = document.getElementById("f09-context-graph-subline");

  /* ── svg-path-draw: measure + park connectors hidden ─────── */
  [connN, connE, connS, connW].forEach(function (el) {
    var len = el.getTotalLength();
    el.style.strokeDasharray  = len;
    el.style.strokeDashoffset = len;
  });

  /* ── svg-path-draw: measure + park hub ring hidden ──────── */
  var ringLen = ring.getTotalLength(); /* ≈ 2π × 170 ≈ 1068 */
  ring.style.strokeDasharray  = ringLen;
  ring.style.strokeDashoffset = ringLen;

  /* ── orbit-3d-entry: park chips at orbital positions, hidden ─
     xPercent / yPercent fold in centering (no CSS transform on chips) */
  gsap.set(chipN, { xPercent: -50, rotateY: -90, z: -280, opacity: 0, scale: 0.45 });
  gsap.set(chipE, { yPercent: -50, rotateX:  80, z: -280, opacity: 0, scale: 0.45 });
  gsap.set(chipS, { xPercent: -50, rotateY:  90, z: -280, opacity: 0, scale: 0.45 });
  gsap.set(chipW, { yPercent: -50, rotateX: -80, z: -280, opacity: 0, scale: 0.45 });

  /* ── timeline ────────────────────────────────────────────── */
  var tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines["09-context-graph"] = tl;

  /* ── multi-phase-camera: pull-back phase → push-in phase + continuous Lissajous drift ──
     SOLE writer of camera.style.transform via the drift onUpdate */
  var phase = { scale: 0.97 }; /* Phase 1: very slight pull-back */

  /* Phase 2: push toward hub center at Scene 2 start (t = 3.8s) */
  tl.to(phase, {
    scale: 1.07,
    duration: 1.4,
    ease: "power2.inOut"
  }, 3.8);

  /* Drift driver — continuous sine Lissajous; DRIFT_FREQ_RATIO = 1.3 (organic, not diagonal) */
  var drift = { p: 0 };
  tl.to(drift, {
    p: Math.PI * 2 * 1.5, /* 1.5 cycles over 8.6s */
    duration: 8.6,
    ease: "none",
    onUpdate: function () {
      var dx = Math.sin(drift.p) * 4;
      var dy = Math.sin(drift.p * 1.3) * 2;
      camera.style.transform =
        "scale(" + phase.scale + ") translate(" + dx + "px," + dy + "px)";
    }
  }, 0);

  /* ── Scene 1 (0.0 – 3.8s): chip spring-entries ─────────────
     orbit-3d-entry: flip in at orbital positions (N→E→W→S clockwise stagger) */
  tl.to(chipN, {
    rotateY: 0, z: 0, opacity: 1, scale: 1,
    duration: 0.65, ease: "back.out(1.6)"
  }, 0.2);
  tl.to(chipE, {
    rotateX: 0, z: 0, opacity: 1, scale: 1,
    duration: 0.65, ease: "back.out(1.6)"
  }, 0.5);
  tl.to(chipW, {
    rotateX: 0, z: 0, opacity: 1, scale: 1,
    duration: 0.65, ease: "back.out(1.6)"
  }, 0.8);
  tl.to(chipS, {
    rotateY: 0, z: 0, opacity: 1, scale: 1,
    duration: 0.65, ease: "back.out(1.6)"
  }, 1.1);

  /* ── Scene 1: connector draws (svg-path-draw, ~70% stagger overlap) */
  tl.to(connN, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 1.50);
  tl.to(connE, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 1.72);
  tl.to(connW, { strokeDashoffset: 0, duration: 0.50, ease: "power2.out" }, 1.94);
  tl.to(connS, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 2.15);

  /* ── Scene 2 (3.8 – 5.5s): violet hub ring draws + label resolves ─ */

  /* Hub ring: svg-path-draw circle; camera push runs simultaneously */
  tl.to(ring, {
    strokeDashoffset: 0,
    duration: 0.90,
    ease: "power2.out"
  }, 3.8);

  /* Hub label: fromTo (exempts GSAP+CSS transform conflict rule) — resolves after ring mostly drawn */
  tl.fromTo(hubLabel,
    { opacity: 0, y: 8 },
    { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
    4.75);

  /* ── Scene 3 (5.5 – 8.6s): sub-line reveal + ring jitter ── */

  /* Sub-line reveal */
  tl.fromTo(subline,
    { opacity: 0, y: 12 },
    { opacity: 1, y: 0, duration: 0.60, ease: "power2.out" },
    5.5);

  /* Ring subtle jitter — explicit opacity-pulse chain (no yoyo/repeat; deterministic) */
  tl.to(ring, { opacity: 0.55, duration: 0.35, ease: "sine.inOut" }, 6.10);
  tl.to(ring, { opacity: 1.00, duration: 0.35, ease: "sine.inOut" }, 6.45);
  tl.to(ring, { opacity: 0.65, duration: 0.30, ease: "sine.inOut" }, 7.20);
  tl.to(ring, { opacity: 1.00, duration: 0.30, ease: "sine.inOut" }, 7.50);

}());
</script>
