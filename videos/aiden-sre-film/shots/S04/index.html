<!doctype html>
<html data-composition-variables='[{"id":"pass","type":"string","label":"Pass: bg|mid|fg|all","default":"all"},{"id":"mode","type":"string","label":"Edit: full|cut","default":"full"}]'>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_shared/tokens/brand.css">
<link rel="stylesheet" href="_shared/layers/layers.css">
<link rel="stylesheet" href="_shared/layers/ui.css">
<style>
  @font-face { font-family: "Geist"; src: url("_shared/assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("_shared/assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
  body { margin: 0; font-family: "Geist", sans-serif; color: var(--sg-cream); }
  .s04-mark {
    position: absolute; width: 120px; height: 120px; box-sizing: border-box;
    background: var(--sg-panel); border: 1px solid var(--sg-hairline); border-radius: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: "Geist", sans-serif; font-weight: 500; font-size: 28px; line-height: 1;
    color: var(--sg-cream);
  }
  .s04-rule {
    position: absolute; left: 0; top: 0; width: 100%; height: 2px;
    background: var(--sg-violet); border-radius: 0;
  }
  .s04-chip {
    position: absolute; width: 72px; height: 72px; box-sizing: border-box;
    border: 1px solid var(--sg-hairline); border-radius: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--sg-cream);
  }
  .s04-chip svg { width: 70%; height: 70%; display: block; }
</style>
<script src="_shared/vendor/gsap.min.js"></script>
<script src="_shared/build/data.js"></script>
</head>
<body>
<div id="root" data-composition-id="S04" data-width="1920" data-height="1080">
  <div id="S04-bg" class="pass pass-bg"></div>
  <div id="S04-mid" class="pass pass-mid"><div class="cam"></div></div>
  <div id="S04-fg" class="pass pass-fg"><div class="cam"></div></div>
</div>
<script type="module">
  import { applyCamera } from "./_shared/layers/camera.js";
  import { arcPoint } from "./_shared/layers/cursor.js";
  import { selectPass, shotData } from "./_shared/layers/shot.js";
  const ID = "S04";
  const DATA_ID = "S04";
  const { pass, mode } = window.__hyperframes.getVariables();
  const { timing, cam } = shotData(DATA_ID, mode);
  const roots = selectPass(ID, pass);
  const bg = document.getElementById("S04-bg");
  const mid = document.querySelector("#S04-mid .cam");
  const tl = gsap.timeline({ paused: true });

  document.getElementById("root").dataset.duration = String(timing.duration);
  const D = timing.duration;
  const { mountRibbons } = await import("./_shared/layers/ribbons.js");
  const { ringPulse } = await import("./_shared/layers/ui.js");
  const { EASE } = await import("./_shared/tokens/motion.js");

  mountRibbons(bg, {
    seed: 104,
    modes: [
      { t: 0, mode: "dormant" },
      { t: 0.3, mode: "converge", target: { x: 1480, y: 540 } },
    ],
  }).bind(tl, D);
  bg.querySelector("canvas").setAttribute("data-layout-allow-overflow", "");

  const mark = document.createElement("div");
  mark.className = "s04-mark";
  mark.style.left = (1480 - 60) + "px";
  mark.style.top = (540 - 60) + "px";
  const rule = document.createElement("div");
  rule.className = "s04-rule";
  const label = document.createElement("div");
  label.textContent = "Aiden";
  mark.appendChild(rule);
  mark.appendChild(label);
  mid.appendChild(mark);
  gsap.set(mark, { opacity: 0 });
  tl.to(mark, { opacity: 1, duration: 0.2, ease: EASE.enter }, 0.1);

  const NS = "http://www.w3.org/2000/svg";
  const LOGOS = ["datadog", "prometheus", "grafana", "opentelemetry", "kubernetes", "aws", "googlecloud", "azure"];
  const arcA = { x: 260, y: 200 };
  const arcB = { x: 260, y: 880 };
  const bend = -520 / 680;
  const css = getComputedStyle(document.documentElement);
  const cream = css.getPropertyValue("--sg-cream").trim();
  const cyan = css.getPropertyValue("--sg-cyan").trim();

  for (let i = 0; i < LOGOS.length; i++) {
    const res = await fetch("_shared/assets/logos/" + LOGOS[i] + ".svg");
    if (!res.ok) throw new Error("logo " + LOGOS[i]);
    const doc = new DOMParser().parseFromString(await res.text(), "image/svg+xml");
    const src = doc.documentElement;
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", src.getAttribute("viewBox") || "0 0 24 24");
    svg.setAttribute("aria-hidden", "true");
    for (const child of src.childNodes) svg.appendChild(document.importNode(child, true));

    const p = arcPoint(arcA, arcB, i / (LOGOS.length - 1), bend);
    const chip = document.createElement("div");
    chip.className = "s04-chip";
    chip.style.left = (p.x - 36) + "px";
    chip.style.top = (p.y - 36) + "px";
    chip.appendChild(svg);
    mid.appendChild(chip);
    gsap.set(chip, { opacity: 0, color: cream });
    tl.to(chip, { opacity: 1, duration: 0.2, ease: EASE.enter }, 0.2 + 0.12 * i);
    tl.fromTo(chip, { color: cream }, {
      color: cyan, duration: 0.2, ease: "none", immediateRender: false,
    }, 0.6 + 0.12 * i);
  }

  ringPulse(tl, mid, { x: 1480 - 60, y: 540 - 60, w: 120, h: 120 }, D - 0.6, { color: "var(--sg-violet)" });

  applyCamera(tl, cam, roots, timing.duration);
  tl.set({}, {}, timing.duration);
  window.__timelines[ID] = tl;
</script>
</body>
</html>
