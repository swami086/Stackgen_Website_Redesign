    img.alt = logo.alt;

    logoHost.appendChild(el);

  LOGOS.forEach((logo, i) => {
    const x1 = logo.side === "l" ? logo.x + logo.w : logo.x;

    path.setAttribute("d", `M ${x1} ${y1} C ${c} ${y1}, ${c} ${y2}, ${x2} ${y2}`);
    if (i % 2 === 1) path.setAttribute("class", "is-cyan");
    svg.appendChild(path);
    const len = path.getTotalLength();
    path.style.strokeDasharray = String(len);
    path.style.strokeDashoffset = String(len);
    const popAt = 0.46 + i * 0.16;
    tl.fromTo(
      logoEls[i],
      { scale: 0.72, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.48, ease: "back.out(1.4)", transformOrigin: "50% 50%" },

  });

    "#f03-card-l",

  tl.to(

    7.58,
