<!DOCTYPE html>
<html data-composition-variables="[{&quot;id&quot;:&quot;pass&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Pass: bg|mid|fg|all&quot;,&quot;default&quot;:&quot;all&quot;},{&quot;id&quot;:&quot;mode&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Edit: full|cut&quot;,&quot;default&quot;:&quot;full&quot;}]">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_shared/tokens/brand.css">
<link rel="stylesheet" href="_shared/layers/layers.css">
<link rel="stylesheet" href="_shared/layers/ui.css">
<link rel="stylesheet" href="_shared/layers/type.css">
<style>
  @font-face { font-family: "Geist"; src: url("_shared/assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("_shared/assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
  body { margin: 0; font-family: "Geist", sans-serif; color: var(--sg-cream); }
  .s08-row {
    position: absolute;
    box-sizing: border-box;
    background: var(--sg-panel);
    border-bottom: 1px solid var(--sg-hairline);
    border-radius: 0;
    overflow: hidden;
  }
  .s08-title {
    position: absolute;
    left: 20px;
    top: 0;
    height: 100%;
    display: flex;
    align-items: center;
    font-family: "Geist", sans-serif;
    font-size: 19px;
    line-height: 1;
    color: var(--sg-cream);
    white-space: nowrap;
  }
  .sg-eyebrow .sg-mask,
  .sg-headline .sg-mask,
  .sg-support .sg-mask {
    position: relative;
    background: transparent;
  }
  .sg-support {
    background: var(--sg-ink);
    padding: 6px 14px;
  }
  .sg-support .sg-rise {
    background: var(--sg-ink);
    color: var(--sg-cream);
  }
  .sg-callout {
    background: var(--sg-ink);
    color: var(--sg-cream);
    padding: 6px 10px;
  }
</style>
<script src="_shared/vendor/gsap.min.js"></script>
<script src="_shared/build/data.js"></script>
</head>
<body>
<div data-hf-id="hf-wpn8" id="root" data-composition-id="S08" data-width="1920" data-height="1080">
  <div data-hf-id="hf-9ew9" id="S08-bg" class="pass pass-bg"></div>
  <div data-hf-id="hf-e37x" id="S08-mid" class="pass pass-mid"><div data-hf-id="hf-12x1" class="cam"></div></div>
  <div data-hf-id="hf-jlgh" id="S08-fg" class="pass pass-fg"><div data-hf-id="hf-wcpl" class="cam"></div></div>
</div>
<script type="module">
  import { applyCamera } from "./_shared/layers/camera.js";
  import { cueT, selectPass, shotData } from "./_shared/layers/shot.js";
  import { mountRibbons } from "./_shared/layers/ribbons.js";
  import { mountPlate } from "./_shared/layers/plate.js";
  import { flipReorder } from "./_shared/layers/ui.js";
  import { mountType } from "./_shared/layers/type.js";

  const ID = "S08";
  const DATA_ID = "S08";
  const PX = 120;
  const PY = 90;
  const PW = 1680;
  const PH = 945;
  const IMPACT = [3, 1, 7, 2, 9, 4, 5, 11, 6, 8, 10, 12];
  const CAPTURED = 7;
  const MOCK_ROWS = {
    8: "redis-cache · Evictions rising",
    9: "Pod Crash Loop",
    10: "inventory-db · Slow queries",
    11: "Pod Crash Loop",
    12: "api-gateway · Upstream resets",
  };

  const { pass, mode } = window.__hyperframes.getVariables();
  const { meta, timing, cam } = shotData(DATA_ID, mode);
  const roots = selectPass(ID, pass);
  const bg = document.getElementById("S08-bg");
  const mid = document.querySelector("#S08-mid .cam");
  const fg = document.querySelector("#S08-fg .cam");
  const tl = gsap.timeline({ paused: true });
  const D = timing.duration;
  document.getElementById("root").dataset.duration = String(D);

  const ribbons = mountRibbons(bg, {
    seed: meta.seed,
    count: 16,
    modes: [{ t: 0, mode: "dormant", opacity: 0.45 }],
  });
  ribbons.bind(tl, D);
  const canvas = bg.querySelector("canvas");
  if (canvas) canvas.setAttribute("data-layout-allow-overflow", "");

  const plate = await mountPlate(mid, { id: "P03", x: PX, y: PY, width: PW });
  const list = plate.box("list");
  const source = plate.el.querySelector("img");
  const rows = [];

  for (let n = 1; n <= CAPTURED; n++) {
    const mask = plate.mask("row-" + n);
    mask.dataset.key = "row-" + n;
  }

  for (let n = 1; n <= CAPTURED; n++) {
    const key = "row-" + n;
    const box = plate.box(key);
    const slot = plate.overlay(key);
    slot.dataset.key = key;
    slot.setAttribute("data-layout-allow-overflow", "");
    const img = source.cloneNode(true);
    img.alt = "";
    img.setAttribute("data-layout-allow-overflow", "");
    img.style.position = "absolute";
    img.style.left = (PX - box.x) + "px";
    img.style.top = (PY - box.y) + "px";
    img.style.width = PW + "px";
    img.style.height = PH + "px";
    slot.appendChild(img);
    rows.push(slot);
  }

  const pitch = plate.box("row-1").h;
  Object.keys(MOCK_ROWS).forEach((num) => {
    const n = Number(num);
    const row = document.createElement("div");
    row.className = "s08-row";
    row.dataset.key = "row-" + n;
    row.dataset.mock = "row-" + n;
    row.style.left = (list.x - PX) + "px";
    row.style.top = (PH + (n - CAPTURED - 1) * pitch) + "px";
    row.style.width = list.w + "px";
    row.style.height = pitch + "px";
    row.setAttribute("data-layout-allow-overflow", "");
    const title = document.createElement("span");
    title.className = "s08-title";
    title.textContent = MOCK_ROWS[n];
    title.setAttribute("data-layout-allow-overflow", "");
    row.appendChild(title);
    plate.el.appendChild(row);
    rows.push(row);
  });

  const order = new Array(IMPACT.length);
  IMPACT.forEach((rowNum, slot) => { order[rowNum - 1] = slot; });
  flipReorder(tl, rows, order, 0.3);

  const colW = 160;
  const maxColRight = 1548;
  const colBox = {
    x: Math.min(list.x + list.w - colW - 16, maxColRight - colW),
    y: list.y,
    w: colW,
    h: list.h,
  };

  const type = mountType(fg);
  const tRank = cueT(timing, "ranked by service impact");
  type.callout(tl, "CLASSIFICATION", tRank, {
    box: colBox,
    leader: true,
    x: colBox.x + colBox.w + 24,
    y: colBox.y,
  });
  type.fromOst(tl, timing.ost, { support: { x: 200, y: 960, inline: true } });
  fg.querySelectorAll(".sg-support, .sg-callout, .sg-leader, .sg-edge").forEach((el) => {
    el.setAttribute("data-layout-allow-overflow", "");
  });
  rows.forEach((row) => row.setAttribute("data-layout-allow-overlap", ""));

  applyCamera(tl, cam, roots, D);
  tl.set({}, {}, D);
  window.__timelines[ID] = tl;
</script>
</body>
</html>
