<!doctype html>
<html data-composition-variables='[{"id":"pass","type":"string","label":"Pass: bg|mid|fg|all","default":"all"},{"id":"mode","type":"string","label":"Edit: full|cut","default":"full"}]'>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_shared/tokens/brand.css">
<link rel="stylesheet" href="_shared/layers/layers.css">
<link rel="stylesheet" href="_shared/layers/ui.css">
<link rel="stylesheet" href="_shared/layers/type.css">
<style>
  @font-face { font-family: "Geist"; src: url("_shared/assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("_shared/assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
  body { margin: 0; font-family: "Geist", sans-serif; color: var(--sg-cream); }
  .s08-row {
    position: absolute;
    box-sizing: border-box;
    background: var(--sg-panel);
    border-bottom: 1px solid var(--sg-hairline);
    border-radius: 0;
    overflow: hidden;
  }
  .s08-rule {
    position: absolute;
    left: 0;
    top: 0;
    width: 3px;
    height: 100%;
    background: var(--sg-coral);
    border-radius: 0;
  }
  .s08-title {
    position: absolute;
    left: 20px;
    top: 0;
    height: 100%;
    display: flex;
    align-items: center;
    font-family: "Geist", sans-serif;
    font-size: 19px;
    line-height: 1;
    color: var(--sg-cream);
    white-space: nowrap;
  }
  .s08-class {
    position: absolute;
    top: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    box-sizing: border-box;
    padding-right: 12px;
    font-family: "Geist Mono", monospace;
    font-size: 15px;
    line-height: 1;
    color: var(--sg-mute);
    white-space: nowrap;
  }
  .sg-eyebrow .sg-mask,
  .sg-headline .sg-mask,
  .sg-support .sg-mask {
    position: relative;
    background: transparent;
  }
  .sg-support {
    background: var(--sg-ink);
    padding: 6px 14px;
  }
  .sg-support .sg-rise {
    background: var(--sg-ink);
    color: var(--sg-cream);
  }
</style>
<script src="_shared/vendor/gsap.min.js"></script>
<script src="_shared/build/data.js"></script>
</head>
<body>
<div id="root" data-composition-id="S08" data-width="1920" data-height="1080">
  <div id="S08-bg" class="pass pass-bg"></div>
  <div id="S08-mid" class="pass pass-mid"><div class="cam"></div></div>
  <div id="S08-fg" class="pass pass-fg"><div class="cam"></div></div>
</div>
<script type="module">
  import { applyCamera } from "./_shared/layers/camera.js";
  import { cueT, selectPass, shotData } from "./_shared/layers/shot.js";
  import { mountRibbons } from "./_shared/layers/ribbons.js";
  import { mountPlate } from "./_shared/layers/plate.js";
  import { flipReorder } from "./_shared/layers/ui.js";
  import { mountType } from "./_shared/layers/type.js";

  const ID = "S08";
  const DATA_ID = "S08";
  const PX = 120;
  const PY = 90;
  const PW = 1680;
  const PH = 945;
  const IMPACT = [3, 1, 7, 2, 9, 4, 5, 11, 6, 8, 10, 12];
  const COPY = [
    { title: "auth-svc · Auth Validation (downstream)", cls: "High" },
    { title: "cart-svc · Pod Crash Loop", cls: "High" },
    { title: "k8s-node-3 · Pod Crash Loop", cls: "Critical", critical: true },
    { title: "checkout-svc · Pod Crash Loop", cls: "Medium" },
    { title: "payments-api · Error rate 4.2%", cls: "Medium" },
    { title: "redis-cache · System Load", cls: "Low" },
    { title: "kafka · Kafka Lag RCA", cls: "High" },
    { title: "orders-svc · Queue depth > 10k", cls: "Low" },
    { title: "inventory-db · Slow queries", cls: "Medium" },
    { title: "search-svc · Timeout ratio 3%", cls: "Info" },
    { title: "api-gateway · Upstream resets", cls: "Low" },
    { title: "frontend-web · 5xx spike", cls: "Info" },
  ];

  const { pass, mode } = window.__hyperframes.getVariables();
  const { meta, timing, cam } = shotData(DATA_ID, mode);
  const roots = selectPass(ID, pass);
  const bg = document.getElementById("S08-bg");
  const mid = document.querySelector("#S08-mid .cam");
  const fg = document.querySelector("#S08-fg .cam");
  const tl = gsap.timeline({ paused: true });
  const D = timing.duration;
  document.getElementById("root").dataset.duration = String(D);

  const ribbons = mountRibbons(bg, {
    seed: meta.seed,
    count: 16,
    modes: [{ t: 0, mode: "dormant", opacity: 0.45 }],
  });
  ribbons.bind(tl, D);
  const canvas = bg.querySelector("canvas");
  if (canvas) canvas.setAttribute("data-layout-allow-overflow", "");

  function mockPanel() {
    const el = document.createElement("div");
    el.className = "sg-plate";
    el.dataset.mock = "P03";
    el.style.left = PX + "px";
    el.style.top = PY + "px";
    el.style.width = PW + "px";
    el.style.height = PH + "px";
    mid.appendChild(el);
    const list = { x: PX + 48, y: PY + 168, w: PW - 96, h: PH - 240 };
    return {
      el,
      plateMissing: true,
      box() { throw new Error("plate P03 missing"); },
      mask() { return el; },
      list,
    };
  }

  let plate;
  let plateMissing = false;
  try {
    plate = await mountPlate(mid, { id: "P03", x: PX, y: PY, width: PW });
  } catch (err) {
    plate = mockPanel();
    plateMissing = true;
  }

  const mocked = [];
  function tryBox(key) {
    if (plateMissing) {
      mocked.push(key);
      return null;
    }
    try {
      return plate.box(key);
    } catch (err) {
      mocked.push(key);
      return null;
    }
  }

  const rowBoxes = COPY.map((_, i) => tryBox("row-" + (i + 1)));
  const colFromPlate = tryBox("col-classification");
  const list = plateMissing ? plate.list : plate.box("list");
  if (!plateMissing) plate.mask("list");

  const colW = 160;
  const maxColRight = 1548;
  const colX = colFromPlate
    ? colFromPlate.x
    : Math.min(list.x + list.w - colW - 16, maxColRight - colW);
  const colBox = colFromPlate || { x: colX, y: list.y, w: colW, h: list.h };

  const usePlateRows = rowBoxes.every(Boolean) && colFromPlate;
  const rows = [];
  const rowH = list.h / COPY.length;
  COPY.forEach((item, i) => {
    const row = document.createElement("div");
    row.className = "s08-row";
    row.dataset.key = "row-" + (i + 1);
    if (usePlateRows) {
      const b = rowBoxes[i];
      row.style.left = (b.x - PX) + "px";
      row.style.top = (b.y - PY) + "px";
      row.style.width = b.w + "px";
      row.style.height = b.h + "px";
    } else {
      row.style.left = (list.x - PX) + "px";
      row.style.top = (list.y - PY + i * rowH) + "px";
      row.style.width = list.w + "px";
      row.style.height = rowH + "px";
    }
    if (item.critical) {
      const rule = document.createElement("span");
      rule.className = "s08-rule";
      row.appendChild(rule);
    }
    const title = document.createElement("span");
    title.className = "s08-title";
    title.textContent = item.title;
    title.setAttribute("data-layout-allow-overlap", "");
    row.appendChild(title);
    const cls = document.createElement("span");
    cls.className = "s08-class";
    cls.textContent = item.cls;
    cls.setAttribute("data-layout-allow-overlap", "");
    cls.style.width = colBox.w + "px";
    const rowRight = usePlateRows ? rowBoxes[i].x + rowBoxes[i].w : list.x + list.w;
    cls.style.right = (rowRight - (colBox.x + colBox.w)) + "px";
    row.appendChild(cls);
    plate.el.appendChild(row);
    rows.push(row);
  });

  const order = new Array(IMPACT.length);
  IMPACT.forEach((rowNum, slot) => { order[rowNum - 1] = slot; });
  flipReorder(tl, rows, order, 0.3);

  const type = mountType(fg);
  const tRank = cueT(timing, "ranked by service impact");
  type.callout(tl, "CLASSIFICATION", tRank, {
    box: colBox,
    leader: true,
    x: colBox.x + colBox.w + 24,
    y: colBox.y,
  });
  type.fromOst(tl, timing.ost, { support: { x: 200, y: 960, inline: true } });
  fg.querySelectorAll(".sg-support, .sg-callout, .sg-leader, .sg-edge").forEach((el) => {
    el.setAttribute("data-layout-allow-overflow", "");
  });
  rows.forEach((row) => row.setAttribute("data-layout-allow-overlap", ""));

  applyCamera(tl, cam, roots, D);
  tl.set({}, {}, D);
  window.__timelines[ID] = tl;
</script>
</body>
</html>
