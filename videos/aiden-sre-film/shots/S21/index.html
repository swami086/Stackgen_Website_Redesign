<!doctype html>
<html data-composition-variables='[{"id":"pass","type":"string","label":"Pass: bg|mid|fg|all","default":"all"},{"id":"mode","type":"string","label":"Edit: full|cut","default":"full"}]'>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_shared/tokens/brand.css">
<link rel="stylesheet" href="_shared/layers/layers.css">
<link rel="stylesheet" href="_shared/layers/ui.css">
<style>
  @font-face { font-family: "Geist"; src: url("_shared/assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("_shared/assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
  body { margin: 0; font-family: "Geist", sans-serif; color: var(--sg-cream); }
  .s21-flip { position: absolute; overflow: hidden; border-radius: 0; }
  .s21-kicker, .s21-title, .s21-line {
    position: absolute; margin: 0; border-radius: 0; color: var(--sg-cream);
  }
  .s21-kicker {
    font-family: "Geist Mono", monospace; font-size: 18px; letter-spacing: 0.12em;
  }
  .s21-title { font-family: "Geist", sans-serif; font-size: 42px; line-height: 1.1; }
  .s21-line { font-family: "Geist Mono", monospace; font-size: 22px; line-height: 1.2; }
  .s21-chip {
    position: absolute; box-sizing: border-box; display: flex; align-items: center;
    width: auto; height: 44px; padding: 0 16px; border-radius: 0;
    background: #F4EFFA; border: 1px solid #E3D8F2;
    color: #1C1A22; font-family: "Geist Mono", monospace; font-size: 20px;
    line-height: 1; white-space: nowrap;
  }
</style>
<script src="_shared/vendor/gsap.min.js"></script>
<script src="_shared/build/data.js"></script>
</head>
<body>
<div id="root" data-composition-id="S21" data-width="1920" data-height="1080">
  <div id="S21-bg" class="pass pass-bg"></div>
  <div id="S21-mid" class="pass pass-mid"><div class="cam"></div></div>
  <div id="S21-fg" class="pass pass-fg"><div class="cam"></div></div>
</div>
<script type="module">
  import { applyCamera } from "./_shared/layers/camera.js";
  import { cueT, selectPass, shotData } from "./_shared/layers/shot.js";
  import { mountRibbons } from "./_shared/layers/ribbons.js";
  import { mountPlate } from "./_shared/layers/plate.js";
  import { leak } from "./_shared/layers/ui.js";
  import { EASE } from "./_shared/tokens/motion.js";

  const ID = "S21";
  const DATA_ID = "S21";
  const PLATE = { x: 120, y: 90, w: 1680, h: 945 };
  const CHIP = { x: 850, y: 512, w: 220, h: 56 };
  const { pass, mode } = window.__hyperframes.getVariables();
  const { meta, timing, cam } = shotData(DATA_ID, mode);
  const roots = selectPass(ID, pass);
  const bg = document.getElementById("S21-bg");
  const mid = document.querySelector("#S21-mid .cam");
  const fg = document.querySelector("#S21-fg .cam");
  const tl = gsap.timeline({ paused: true });
  const D = timing.duration;
  document.getElementById("root").dataset.duration = String(D);

  mountRibbons(bg, {
    seed: meta.seed,
    count: 16,
    modes: [{ t: 0, mode: "dormant", opacity: 0.5 }],
  }).bind(tl, D);
  const canvas = bg.querySelector("canvas");
  if (canvas) canvas.setAttribute("data-layout-allow-overflow", "");
  leak(tl, bg, 0, { src: "_shared/assets/gen/G02-1.png" });

  const flip = document.createElement("div");
  flip.className = "s21-flip";
  flip.style.left = PLATE.x + "px";
  flip.style.top = PLATE.y + "px";
  flip.style.width = PLATE.w + "px";
  flip.style.height = PLATE.h + "px";
  mid.appendChild(flip);

  let plateEl;
  try {
    const plate = await mountPlate(flip, { id: "P12", x: 0, y: 0, width: PLATE.w });
    plateEl = plate.el;
  } catch (err) {
    plateEl = resolvedPanel(flip);
  }

  const learn = cueT(timing, "learning");
  const insetTop = CHIP.y - PLATE.y;
  const insetLeft = CHIP.x - PLATE.x;
  const insetRight = PLATE.w - insetLeft - CHIP.w;
  const insetBottom = PLATE.h - insetTop - CHIP.h;
  const clipEnd = "inset(" + insetTop + "px " + insetRight + "px " + insetBottom + "px " + insetLeft + "px)";
  tl.fromTo(flip, { clipPath: "inset(0px)" }, {
    clipPath: clipEnd, duration: 0.8, ease: EASE.enter,
  }, learn);
  tl.fromTo(plateEl, {
    x: 0, y: 0, scaleX: 1, scaleY: 1, transformOrigin: "0% 0%",
  }, {
    x: insetLeft,
    y: insetTop,
    scaleX: CHIP.w / PLATE.w,
    scaleY: CHIP.h / PLATE.h,
    transformOrigin: "0% 0%",
    duration: 0.8,
    ease: EASE.enter,
  }, learn);

  const label = document.createElement("div");
  label.className = "s21-chip";
  label.dataset.key = "incident-chip";
  label.style.left = CHIP.x + "px";
  label.style.top = CHIP.y + "px";
  label.textContent = "checkout-svc · rollback";
  label.setAttribute("data-layout-allow-occlusion", "");
  mid.appendChild(label);
  tl.fromTo(label, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, learn + 0.6);

  const floatAt = learn + 1;
  tl.to(flip, { y: -20, duration: Math.max(0.001, D - floatAt), ease: "none" }, floatAt);
  tl.to(label, { y: -20, duration: Math.max(0.001, D - floatAt), ease: "none" }, floatAt);

  applyCamera(tl, cam, roots, D);
  tl.set({}, {}, D);
  window.__timelines[ID] = tl;

  function resolvedPanel(host) {
    const el = document.createElement("div");
    el.className = "sg-plate";
    el.dataset.mock = "P12";
    el.style.left = "0px";
    el.style.top = "0px";
    el.style.width = PLATE.w + "px";
    el.style.height = PLATE.h + "px";
    host.appendChild(el);
    const kicker = document.createElement("div");
    kicker.className = "s21-kicker";
    kicker.style.left = "48px";
    kicker.style.top = "48px";
    kicker.textContent = "INCIDENT";
    const title = document.createElement("div");
    title.className = "s21-title";
    title.style.left = "48px";
    title.style.top = "96px";
    title.textContent = "checkout-svc";
    el.appendChild(kicker);
    el.appendChild(title);
    const lines = ["Status  Resolved", "Action  rollback", "Error rate  baseline"];
    lines.forEach((text, i) => {
      const line = document.createElement("div");
      line.className = "s21-line";
      line.style.left = "48px";
      line.style.top = (220 + i * 48) + "px";
      line.textContent = text;
      el.appendChild(line);
    });
    return el;
  }
</script>
</body>
</html>
