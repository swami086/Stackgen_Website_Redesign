<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0c0e; }
      #root { width: 1920px; height: 1080px; position: relative; }
      #stage {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at 50% 30%, #16171c 0%, #0b0c0e 70%);
        display: flex; align-items: center; justify-content: center;
      }
      #card {
        width: 1760px; height: 990px; border-radius: 14px;
        background: #151619; border: 1px solid #2a2c33; overflow: hidden;
        display: flex; flex-direction: column;
      }
      #chrome {
        height: 40px; flex-shrink: 0; display: flex; align-items: center;
        padding: 0 14px; background: #151619; border-bottom: 1px solid #2a2c33;
      }
      .dots { display: flex; gap: 7px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #3a3d45; }
      #screen { flex: 1; position: relative; overflow: hidden; background: #0f1115; }
      #world {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        transform-origin: 0 0; will-change: transform;
      }
      #world img.ui {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        object-fit: cover; object-position: left top;
      }
      .tgt { position: absolute; opacity: 0; pointer-events: none; }
      #t-chips { left: 300px; top: 118px; width: 1480px; height: 150px; }
      #t-actnow { left: 560px; top: 122px; width: 300px; height: 140px; }
      #t-row1 { left: 300px; top: 360px; width: 1200px; height: 100px; }
      #t-pod { left: 300px; top: 460px; width: 1200px; height: 180px; }
      /* Yellow narrative rings — border only (no chromatic glow) */
      .hl {
        position: absolute;
        border: 4px solid #F5C518;
        outline: 3px solid rgba(0, 0, 0, 0.45);
        outline-offset: 3px;
        border-radius: 14px;
        pointer-events: none;
        opacity: 0;
        background: rgba(245, 197, 24, 0.12);
        box-sizing: border-box;
      }
      #hl-chips { left: 300px; top: 118px; width: 1480px; height: 150px; }
      #hl-actnow { left: 560px; top: 122px; width: 300px; height: 140px; }
      #hl-row1 { left: 300px; top: 360px; width: 1200px; height: 100px; }
      #hl-pod { left: 300px; top: 460px; width: 1200px; height: 180px; }
      #vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.35) 100%);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <!--
      plate-a — silent SCRIPT beats 1–3 (~26s). Problem: alert storm + root vs downstream.
      Camera: focusPoseSafe PAD=72 zoom in+out. Yellow #F5C518 rings on narrative targets.
      Clueso owns Chris VO. Assets: alerts-ui.png from stage capture.
    -->
    <div id="root" data-composition-id="plate-a" data-start="0" data-duration="26" data-width="1920" data-height="1080">
      <div id="stage">
        <div id="card">
          <div id="chrome"><div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
          <div id="screen" data-layout-allow-overflow>
            <div id="world" data-layout-allow-overflow>
              <img class="ui" src="assets/alerts-ui.png" alt="" />
              <div class="tgt" id="t-chips"></div>
              <div class="tgt" id="t-actnow"></div>
              <div class="tgt" id="t-row1"></div>
              <div class="tgt" id="t-pod"></div>
              <div class="hl" id="hl-chips"></div>
              <div class="hl" id="hl-actnow"></div>
              <div class="hl" id="hl-row1"></div>
              <div class="hl" id="hl-pod"></div>
            </div>
            <div id="vignette"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const world = document.getElementById("world");
      const vignette = document.getElementById("vignette");
      const W = 1920, H = 1080, PAD = 72, IN = 1.05, OUT = 0.95;

      function clearHl() {
        document.querySelectorAll(".hl").forEach((el) => {
          gsap.killTweensOf(el);
          gsap.set(el, { opacity: 0, scale: 1 });
        });
      }
      function showHl(id) {
        clearHl();
        const el = document.getElementById(id);
        if (!el) return;
        gsap.fromTo(
          el,
          { opacity: 0, scale: 0.985 },
          { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }
        );
        gsap.to(el, {
          opacity: 0.85,
          duration: 0.7,
          yoyo: true,
          repeat: 1,
          ease: "sine.inOut",
        });
      }

      function measureTarget(sel) {
        const el = document.querySelector(sel);
        void world.offsetWidth;
        const wr = world.getBoundingClientRect();
        const er = el.getBoundingClientRect();
        return {
          x: er.left - wr.left,
          y: er.top - wr.top,
          w: er.width,
          h: er.height,
        };
      }

      function focusPoseSafe(m, desiredS) {
        const maxSx = (W - 2 * PAD) / m.w;
        const maxSy = (H - 2 * PAD) / m.h;
        const s = Math.min(desiredS, maxSx, maxSy, 1.42);
        let tx = W / 2 - s * (m.x + m.w / 2);
        let ty = H / 2 - s * (m.y + m.h / 2);
        const minTx = PAD - s * m.x;
        const maxTx = W - PAD - s * (m.x + m.w);
        const minTy = PAD - s * m.y;
        const maxTy = H - PAD - s * (m.y + m.h);
        tx = Math.min(minTx, Math.max(maxTx, tx));
        ty = Math.min(minTy, Math.max(maxTy, ty));
        return { x: tx, y: ty, scale: s };
      }

      function zoomCycle(pose, tIn, holdDur, outDur) {
        tl.to(world, { x: pose.x, y: pose.y, scale: pose.scale, duration: IN, ease: "power2.inOut" }, tIn);
        tl.to(vignette, { opacity: 0.55, duration: IN * 0.8, ease: "power1.out" }, tIn);
        const tOut = tIn + IN + holdDur;
        tl.to(world, { x: 0, y: 0, scale: 1, duration: outDur, ease: "power2.inOut" }, tOut);
        tl.to(vignette, { opacity: 0, duration: outDur * 0.9, ease: "power1.in" }, tOut);
      }

      gsap.set(world, { x: 0, y: 0, scale: 1, transformOrigin: "0 0" });
      gsap.set(vignette, { opacity: 0 });
      clearHl();

      const T = {
        chips: measureTarget("#t-chips"),
        act: measureTarget("#t-actnow"),
        row1: measureTarget("#t-row1"),
        pod: measureTarget("#t-pod"),
      };

      const tl = gsap.timeline({ paused: true });

      tl.call(() => showHl("hl-chips"), null, 0.6);
      zoomCycle(focusPoseSafe(T.chips, 1.28), 0.8, 3.8, OUT);
      tl.call(clearHl, null, 6.2);

      tl.call(() => showHl("hl-actnow"), null, 9.8);
      zoomCycle(focusPoseSafe(T.act, 1.34), 10.0, 2.2, 0.7);
      tl.call(() => showHl("hl-row1"), null, 13.2);
      zoomCycle(focusPoseSafe(T.row1, 1.34), 13.3, 1.8, 0.65);
      tl.call(() => showHl("hl-pod"), null, 16.0);
      zoomCycle(focusPoseSafe(T.pod, 1.34), 16.1, 2.0, OUT);

      tl.call(() => showHl("hl-pod"), null, 20.2);
      zoomCycle(focusPoseSafe(T.pod, 1.36), 20.3, 2.4, 0.7);
      tl.call(clearHl, null, 25.2);

      window.__timelines = window.__timelines || {};
      window.__timelines["plate-a"] = tl;
    </script>
  </body>
</html>
