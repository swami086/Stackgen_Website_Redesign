<style>

    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: "Geist", sans-serif;

  }
  .clip {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

    background: radial-gradient(1200px 700px at 50% 38%, var(--sg-ink-raised) 0%, var(--sg-ink) 72%);
  }
  .f10-world {
    perspective: 2400px;
    transform-style: preserve-3d;
  }
  .f10-cam {
    position: absolute;
    left: 960px;
    top: 420px;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
  }
  .f10-panel-stage {
    position: absolute;
    left: -768px;
    top: -360px;
    width: 1536px;
    height: 760px;

  .f10-panel-glow {
    position: absolute;

  .f10-panel {
    position: absolute;

  }
  .f10-panel::before {
    content: "";

  .f10-ui-viewport {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #f4f5f8;
    transform-style: preserve-3d;
  }
  .f10-ui-scaler {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 886px;
    transform: scale(0.8);

  .f10-ui-scroller {
    position: absolute;
    left: 0;
    top: 0;

    position: absolute;

  .f10-ost {
    position: absolute;

    max-width: 640px;

    font-weight: 400;
    line-height: 1.2;
    color: var(--sg-cream);
    text-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
  }
  .f10-ost .word {
    display: inline-block;

  .f10-hypo-card {
    position: absolute;
    left: 248px;
    top: 520px;
    width: 620px;
    padding: 18px 20px 16px;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid #e2e5e9;

  .f10-hypo-title {
    font-family: "Geist", sans-serif;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .f10-hypo-row {
    display: flex;
    align-items: center;
    gap: 12px;

  .f10-hypo-row.is-struck {
    opacity: 0.45;
  }
  .f10-hypo-row.is-struck .label {
    text-decoration: line-through;
  }
  .f10-hypo-track {
    flex: 1;
    height: 8px;
    background: #e6eaee;
    border-radius: 4px;
    overflow: hidden;
  }
  .f10-hypo-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #9e33ea, #ba99fd);
    transform: scaleX(0);
    transform-origin: left center;
  }
  .f10-hypo-pct {
    width: 44px;
    font-family: "Geist Mono", monospace;
    font-size: 13px;
    text-align: right;
  }
  .f10-callout {
    position: absolute;
    left: 880px;
    top: 640px;
    padding: 10px 14px;
    font-family: "Geist Mono", monospace;
    font-size: 20px;
    font-weight: 500;
    color: var(--sg-cream);
    background: var(--sg-panel);
    border: 1px solid var(--sg-hairline);
    opacity: 0;
    transform: translateY(12px);
  }
  .f10-track-box {
    position: absolute;
    left: 520px;
    top: 300px;
    width: 280px;
    height: 120px;
    pointer-events: none;
    opacity: 0;
  }
  .f10-track-box .corner {
    position: absolute;
    width: 36px;
    height: 36px;
    border-color: #facc15;
    border-style: solid;
  }
  .f10-track-box .tl {
    top: 0;
    left: 0;
    border-width: 4px 0 0 4px;
  }
  .f10-track-box .tr {
    top: 0;
    right: 0;
    border-width: 4px 4px 0 0;
  }
  .f10-track-box .bl {
    bottom: 0;
    left: 0;
    border-width: 0 0 4px 4px;
  }
  .f10-track-box .br {
    bottom: 0;
    right: 0;
    border-width: 0 4px 4px 0;
  }
  .f10-track-label {
    position: absolute;
    top: -36px;
    left: 0;
    padding: 4px 8px;
    background: #facc15;
    color: #111;
    font-family: "Geist Mono", monospace;
    font-size: 14px;
    white-space: nowrap;
  }
</style>

<script src="assets/frames/10/vendor/gsap.min.js"></script>
<script type="module">
  const ID = "10-investigation";
  const D = 13.185;
  const T = {
    panelOpen: 0.35,
    chipsStart: 3.41,
    chipsEnd: 5.68,
    hypoOst: 7.86,
    hypoBuild: 7.74,
    ruledOut: 12.37,
  };

  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  window.__timelines[ID] = tl;

  const { mountRibbons } = await import(
    new URL("../../assets/frames/10/ribbons-mount.js", import.meta.url).href,
  );

  const ribbonHost = document.getElementById("f10-ribbon-host");
  mountRibbons(ribbonHost, {
    seed: 410,
    count: 26,
    split: 0.68,
    modes: [
      { t: 0, mode: "dormant", opacity: 0.55 },
      { t: 2.8, mode: "converge", opacity: 0.85, target: { x: 960, y: 420 } },
      { t: 8.5, mode: "rail", opacity: 0.72 },
    ],
  }).bind(tl, D);

  const cam = document.getElementById("f10-cam");
  const panelStage = document.getElementById("f10-panel-stage");
  const panel = document.getElementById("f10-panel");
  const uiScroller = document.getElementById("f10-ui-scroller");
  const uiA = document.getElementById("f10-ui-a");
  const uiB = document.getElementById("f10-ui-b");
  const dofNav = document.getElementById("f10-dof-nav");
  const dofEvidence = document.getElementById("f10-dof-evidence");
  const hypoCard = document.getElementById("f10-hypo-card");
  const callout = document.getElementById("f10-callout");
  const trackBox = document.getElementById("f10-track-box");
  const trackLabel = document.getElementById("f10-track-label");
  const ostWords = document.querySelectorAll("#f10-ost .word");

  gsap.set(panelStage, {
    rotationX: 6,
    rotationY: -10,
    transformPerspective: 2400,
  });
  gsap.set(panel, {
    rotationX: 6,
    rotationY: -10,
    transformPerspective: 2400,
  });
  gsap.set(hypoCard, { opacity: 0, y: 24 });
  gsap.set([uiA, uiB], { opacity: 1 });
  gsap.set(uiB, { opacity: 0 });

  tl.fromTo(
    panelStage,
    { y: 220, scale: 0.72, rotationX: 22, rotationY: -6, opacity: 0.2 },
    {
      y: 0,
      scale: 1,
      rotationX: 6,
      rotationY: -10,
      opacity: 1,
      duration: 0.85,
      ease: "back.out(1.4)",
    },
    0.05,
  );

  tl.fromTo(
    cam,
    { scale: 0.96, x: 18, y: 10 },
    { scale: 1.06, x: -22, y: -8, duration: D, ease: "power2.inOut" },
    0,
  );

  tl.fromTo(
    uiScroller,
    { y: 0 },
    { y: -180, duration: 2.4, ease: "power2.inOut" },
    0.9,
  );
  tl.to(uiScroller, { y: -1025, duration: 1.8, ease: "power2.inOut" }, 6.2);

  tl.to(dofNav, { "--dof": "8px", opacity: 0.55, duration: 0.8, ease: "power2.inOut" }, 1.2);
  tl.to(dofEvidence, { "--dof": "9px", opacity: 0.62, duration: 0.8, ease: "power2.inOut" }, 1.2);

  const chips = [
    { el: document.getElementById("f10-chip-logs"), from: { x: -120, y: 780 }, to: { x: 420, y: 360 } },
    { el: document.getElementById("f10-chip-metrics"), from: { x: 1920, y: 200 }, to: { x: 760, y: 320 } },
    { el: document.getElementById("f10-chip-events"), from: { x: 960, y: -80 }, to: { x: 1080, y: 400 } },
  ];
  chips.forEach((c, i) => {
    gsap.set(c.el, { opacity: 0, x: c.from.x, y: c.from.y, scale: 0.88 });
    tl.fromTo(
      c.el,
      { opacity: 0, x: c.from.x, y: c.from.y, scale: 0.88 },
      {
        opacity: 1,
        x: c.to.x,
        y: c.to.y,
        scale: 1,
        duration: 1.05,
        ease: "power3.out",
      },
      T.chipsStart + i * 0.22,
    );
    tl.to(c.el, { opacity: 0, scale: 0.94, duration: 0.45, ease: "power1.in" }, T.chipsEnd + i * 0.08);
  });

  tl.fromTo(
    trackBox,
    { opacity: 0, scale: 0.82 },
    { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.6)" },
    4.2,
  );
  const trackDriver = { p: 0 };
  tl.to(
    trackDriver,
    {
      p: Math.PI * 4,
      duration: 3.2,
      ease: "none",
      onUpdate: () => {
        const mx = 640 + Math.cos(trackDriver.p) * 36;
        const my = 340 + Math.sin(trackDriver.p * 0.9) * 22;
        const w = 260 + Math.sin(trackDriver.p * 2.1) * 18;
        const h = 110 + Math.cos(trackDriver.p * 1.7) * 12;
        trackBox.style.left = `${mx}px`;
        trackBox.style.top = `${my}px`;
        trackBox.style.width = `${w}px`;
        trackBox.style.height = `${h}px`;
        const conf = Math.round(96 + Math.sin(trackDriver.p * 5.2) * 2);
        trackLabel.textContent = `ROOT CAUSE · ${conf}%`;
      },
    },
    4.4,
  );
  tl.to(trackBox, { opacity: 0, duration: 0.35, ease: "power1.in" }, 7.5);

  tl.fromTo(hypoCard, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, T.hypoBuild);

  document.querySelectorAll(".f10-hypo-fill").forEach((fill, i) => {
    const pct = parseFloat(fill.dataset.pct || "0.5");
    tl.fromTo(fill, { scaleX: 0 }, { scaleX: pct, duration: 0.85, ease: "power2.out" }, T.hypoBuild + 0.15 + i * 0.14);
  });

  const ostTimings = {
    hyp: { start: 7.5, end: 8.1 },
    conf: { start: 8.0, end: 8.55 },
    scores: { start: 7.86, end: 8.35 },
  };
  const ostDriver = { t: 0 };
  tl.to(
    ostDriver,
    {
      t: D,
      duration: D,
      ease: "none",
      onUpdate: () => {
        ostWords.forEach((el) => {
          const key = el.dataset.word;
          const w = ostTimings[key];
          if (!w) return;
          let env = 0;
          const time = ostDriver.t;
          if (time >= w.start && time < w.end) env = Math.min((time - w.start) / 0.12, 1);
          else if (time >= w.end) env = Math.max(0.18, 1 - (time - w.end) / 0.35);
          el.style.textShadow = `0 0 ${34 * env}px rgba(186,153,253,${0.35 + env * 0.45})`;
          el.style.transform = `scale(${1 + env * 0.08})`;
          el.style.color = env > 0.35 ? "#faf7f2" : "#96897c";
        });
      },
    },
    0,
  );
  tl.fromTo(
    document.getElementById("f10-ost"),
    { opacity: 0, y: 16 },
    { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
    7.5,
  );

  tl.to(uiA, { opacity: 0, duration: 0.001 }, T.ruledOut);
  tl.to(uiB, { opacity: 1, duration: 0.001 }, T.ruledOut);

  const lowRows = document.querySelectorAll('.f10-hypo-row[data-row="1"], .f10-hypo-row[data-row="2"], .f10-hypo-row[data-row="3"]');
  tl.set(lowRows, { className: "f10-hypo-row is-struck" }, T.ruledOut);
  tl.fromTo(
    callout,
    { opacity: 0, y: 16, scale: 0.94 },
    { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.8)" },
    T.ruledOut,
  );

  tl.to(
    panelStage,
    { rotationX: 4, rotationY: -8, duration: 2.4, ease: "sine.inOut" },
    10.2,
  );

  tl.to({}, { duration: D }, 0);
</script>
</template>
