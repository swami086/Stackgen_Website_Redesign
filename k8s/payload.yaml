# Postgres only — Payload CMS now runs inside stackgen-web (same Next.js process).
# Admin: http://<stackgen-web-LB>/admin
# Keep this Deployment for the existing PVC / ClusterIP used by DATABASE_URL.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stackgen-payload-pgdata
  namespace: default
  labels:
    app: stackgen-payload-db
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stackgen-payload-db
  namespace: default
  labels:
    app: stackgen-payload-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stackgen-payload-db
  template:
    metadata:
      labels:
        app: stackgen-payload-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: payload
            - name: POSTGRES_DB
              value: payload
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stackgen-payload
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "payload", "-d", "payload"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "payload", "-d", "payload"]
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: stackgen-payload-pgdata
---
apiVersion: v1
kind: Service
metadata:
  name: stackgen-payload-db
  namespace: default
  labels:
    app: stackgen-payload-db
spec:
  type: ClusterIP
  selector:
    app: stackgen-payload-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
