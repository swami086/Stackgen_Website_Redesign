# Single-package app; required by pnpm 11 for allowBuilds / hoist settings.
packages:
  - "."

shamefullyHoist: true

allowBuilds:
  sharp: true
  esbuild: true
  "@swc/core": true
  unrs-resolver: true
  workerd: false
  '@parcel/watcher': set this to true or false

minimumReleaseAgeExclude:
  - '@delmaredigital/payload-puck@0.9.0'
