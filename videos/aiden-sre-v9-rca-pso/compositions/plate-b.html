<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0c0e; }
      #root { width: 1920px; height: 1080px; position: relative; }
      #stage {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at 50% 30%, #16171c 0%, #0b0c0e 70%);
        display: flex; align-items: center; justify-content: center;
      }
      #card {
        width: 1760px; height: 990px; border-radius: 14px;
        background: #151619; border: 1px solid #2a2c33; overflow: hidden;
        display: flex; flex-direction: column;
      }
      #chrome {
        height: 48px; flex-shrink: 0; display: flex; align-items: center;
        padding: 12px 16px; background: #151619; border-bottom: 1px solid #2a2c33;
      }
      .dots { display: flex; gap: 7px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #3a3d45; }
      #screen { flex: 1; position: relative; overflow: hidden; background: #0f1115; }
      #world {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        transform-origin: 0 0; will-change: transform;
      }
      #world img.ui {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        object-fit: cover; object-position: left top;
      }
      #ui-deep { opacity: 0; }
      .tgt { position: absolute; opacity: 0; pointer-events: none; }
      #t-metrics { left: 72px; top: 250px; width: 1180px; height: 120px; }
      #t-rca { left: 72px; top: 390px; width: 1180px; height: 230px; }
      #t-triage { left: 72px; top: 680px; width: 1180px; height: 140px; }
      #t-evidence { left: 1420px; top: 80px; width: 460px; height: 820px; }
      .hl {
        position: absolute;
        border: 4px solid #F5C518;
        outline: 3px solid rgba(0, 0, 0, 0.45);
        outline-offset: 3px;
        border-radius: 12px;
        pointer-events: none;
        opacity: 0;
        background: rgba(245, 197, 24, 0.12);
      }
      #hl-metrics { left: 68px; top: 246px; width: 1188px; height: 128px; }
      #hl-rca { left: 68px; top: 386px; width: 1188px; height: 238px; }
      #hl-triage { left: 68px; top: 676px; width: 1188px; height: 148px; }
      #hl-evidence { left: 1416px; top: 76px; width: 468px; height: 828px; }
      #vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.32) 100%);
        opacity: 0;
      }
      #end-card {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(8, 9, 12, 0.72); opacity: 0; pointer-events: none; z-index: 20;
        padding: 64px;
      }
      #end-inner {
        text-align: center; color: #f4f5f7;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 48px 64px;
        max-width: 1100px;
      }
      #end-inner .h {
        font-size: 56px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25;
        padding: 16px 20px;
      }
      #end-inner .s {
        margin-top: 18px; font-size: 28px; font-weight: 400; color: #c8ccd4;
        padding: 12px 16px;
      }
    </style>
  </head>
  <body>
    <!--
      plate-b — silent SCRIPT beats 6–7 (~14s). Outcome RCA + end card.
      Camera: focusPoseSafe zoom in+out. Yellow #F5C518 rings.
      End card = outcome headline + CTA (not process-state caption).
      Clueso owns Chris VO. No plate audio.
    -->
    <div id="root" data-composition-id="plate-b" data-start="0" data-duration="14" data-width="1920" data-height="1080">
      <div id="stage">
        <div id="card">
          <div id="chrome"><div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
          <div id="screen" data-layout-allow-overflow>
            <div id="world" data-layout-allow-overflow>
              <img class="ui" id="ui-hero" src="assets/rca-hero.png" alt="" />
              <img class="ui" id="ui-deep" src="assets/rca-deep.png" alt="" />
              <div class="tgt" id="t-metrics"></div>
              <div class="tgt" id="t-rca"></div>
              <div class="tgt" id="t-triage"></div>
              <div class="tgt" id="t-evidence"></div>
              <div class="hl" id="hl-metrics"></div>
              <div class="hl" id="hl-rca"></div>
              <div class="hl" id="hl-triage"></div>
              <div class="hl" id="hl-evidence"></div>
            </div>
            <div id="vignette"></div>
            <div id="end-card" data-layout-allow-occlusion data-layout-allow-overlap>
              <div id="end-inner">
                <div class="h">Empower your engineers.</div>
                <div class="s">Try Aiden for SRE today</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const world = document.getElementById("world");
      const vignette = document.getElementById("vignette");
      const endCard = document.getElementById("end-card");
      const uiHero = document.getElementById("ui-hero");
      const uiDeep = document.getElementById("ui-deep");
      const W = 1920, H = 1080, PAD = 72, IN = 0.95, OUT = 0.75;

      function clearHl() {
        document.querySelectorAll(".hl").forEach((el) => {
          gsap.killTweensOf(el);
          gsap.set(el, { opacity: 0, scale: 1 });
        });
      }
      function showHl(id) {
        clearHl();
        const el = document.getElementById(id);
        if (!el) return;
        gsap.fromTo(el, { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" });
        gsap.to(el, { opacity: 0.88, duration: 0.48, yoyo: true, repeat: 1, ease: "sine.inOut" });
      }

      function measureTarget(sel) {
        const el = document.querySelector(sel);
        void world.offsetWidth;
        const wr = world.getBoundingClientRect();
        const er = el.getBoundingClientRect();
        return { x: er.left - wr.left, y: er.top - wr.top, w: er.width, h: er.height };
      }

      function focusPoseSafe(m, desiredS) {
        const maxSx = (W - 2 * PAD) / m.w;
        const maxSy = (H - 2 * PAD) / m.h;
        const s = Math.min(desiredS, maxSx, maxSy, 1.42);
        let tx = W / 2 - s * (m.x + m.w / 2);
        let ty = H / 2 - s * (m.y + m.h / 2);
        const minTx = PAD - s * m.x;
        const maxTx = W - PAD - s * (m.x + m.w);
        const minTy = PAD - s * m.y;
        const maxTy = H - PAD - s * (m.y + m.h);
        tx = Math.min(minTx, Math.max(maxTx, tx));
        ty = Math.min(minTy, Math.max(maxTy, ty));
        return { x: tx, y: ty, scale: s };
      }

      function zoomCycle(pose, tIn, holdDur, outDur) {
        tl.to(world, { x: pose.x, y: pose.y, scale: pose.scale, duration: IN, ease: "power2.inOut" }, tIn);
        tl.to(vignette, { opacity: 0.5, duration: IN * 0.8, ease: "power1.out" }, tIn);
        const tOut = tIn + IN + holdDur;
        tl.to(world, { x: 0, y: 0, scale: 1, duration: outDur, ease: "power2.inOut" }, tOut);
        tl.to(vignette, { opacity: 0, duration: outDur * 0.9, ease: "power1.in" }, tOut);
      }

      gsap.set(world, { x: 0, y: 0, scale: 1, transformOrigin: "0 0" });
      gsap.set(vignette, { opacity: 0 });
      gsap.set(endCard, { opacity: 0 });
      gsap.set(uiDeep, { opacity: 0 });
      clearHl();

      const T = {
        metrics: measureTarget("#t-metrics"),
        rca: measureTarget("#t-rca"),
        triage: measureTarget("#t-triage"),
        evidence: measureTarget("#t-evidence"),
      };

      const tl = gsap.timeline({ paused: true });

      /* Beat 6: tools/evidence + RCA context (paste: plugs in / context / guardrails) */
      tl.call(() => showHl("hl-evidence"), null, 0.35);
      zoomCycle(focusPoseSafe(T.evidence, 1.28), 0.4, 1.6, 0.6);
      tl.call(() => showHl("hl-rca"), null, 3.0);
      zoomCycle(focusPoseSafe(T.rca, 1.28), 3.1, 1.6, 0.6);
      tl.to(uiDeep, { opacity: 1, duration: 0.35, ease: "power1.inOut" }, 5.6);
      tl.to(uiHero, { opacity: 0, duration: 0.35, ease: "power1.inOut" }, 5.6);
      tl.call(() => showHl("hl-metrics"), null, 6.0);
      zoomCycle(focusPoseSafe(T.metrics, 1.28), 6.1, 1.3, 0.55);

      /* Beat 7: end card — Empower your engineers. */
      tl.call(clearHl, null, 8.4);
      tl.to(vignette, { opacity: 0.15, duration: 0.3 }, 8.5);
      tl.to(endCard, { opacity: 1, duration: 0.55, ease: "power2.out" }, 8.6);
      tl.to({}, { duration: 4.8 }, 9.2);

      window.__timelines = window.__timelines || {};
      window.__timelines["plate-b"] = tl;
    </script>
  </body>
</html>
