# Local stack — Payload CMS runs inside the Next.js web app (not a separate service).
# Build context is repo root: docker compose -f stack/docker-compose.yml up --build
#
#   Site:   http://127.0.0.1:3000
#   Admin:  http://127.0.0.1:3000/admin
name: stackgen-stack

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in stack/.env}
      POSTGRES_DB: payload
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload -d payload"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ../web
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      CMS_PROVIDER: payload
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in stack/.env}
      DATABASE_URL: postgresql://payload:${POSTGRES_PASSWORD}@postgres:5432/payload
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-http://127.0.0.1:3000}
    volumes:
      - payload-media:/app/media

volumes:
  pgdata:
  payload-media:
