name: stackgen-payload

services:
  payload:
    image: node:24-alpine
    container_name: stackgen-payload
    ports:
      - "3002:3000"
    volumes:
      - .:/home/node/app
      - payload_node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: >
      sh -c "corepack enable && corepack prepare pnpm@10 --activate
      && pnpm install
      && pnpm exec next dev --hostname 0.0.0.0 --port 3000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"

  postgres:
    container_name: stackgen-payload-db
    restart: unless-stopped
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: payload
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payload"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  payload_node_modules:
