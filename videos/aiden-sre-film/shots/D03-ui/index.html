<!DOCTYPE html>
<html data-composition-variables="[{&quot;id&quot;:&quot;pass&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Pass: bg|mid|fg|all&quot;,&quot;default&quot;:&quot;all&quot;},{&quot;id&quot;:&quot;mode&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Edit: full|cut&quot;,&quot;default&quot;:&quot;full&quot;}]">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_shared/tokens/brand.css">
<link rel="stylesheet" href="_shared/layers/layers.css">
<link rel="stylesheet" href="_shared/layers/ui.css">
<style>
  @font-face { font-family: "Geist"; src: url("_shared/assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("_shared/assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
  body { margin: 0; font-family: "Geist", sans-serif; color: var(--sg-cream); }
  .d03-row {
    height: 100%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    padding: 0 28px;
    color: var(--sg-cream);
    font-family: var(--sg-mono);
    font-size: 22px;
    background: var(--sg-panel);
    border-bottom: 1px solid var(--sg-hairline);
    border-radius: 0;
    overflow: hidden;
  }
</style>
<script src="_shared/vendor/gsap.min.js"></script>
<script src="_shared/build/data.js"></script>
</head>
<body>
<div data-hf-id="hf-cwxr" id="root" data-composition-id="D03-ui" data-width="1920" data-height="1080" data-duration="5.793">
  <div data-hf-id="hf-ug86" id="D03-ui-bg" class="pass pass-bg"></div>
  <div data-hf-id="hf-bvri" id="D03-ui-mid" class="pass pass-mid"><div data-hf-id="hf-12x1" class="cam"></div></div>
  <div data-hf-id="hf-hmse" id="D03-ui-fg" class="pass pass-fg"><div data-hf-id="hf-wcpl" class="cam"></div></div>
</div>
<script type="module">
  import { applyCamera } from "./_shared/layers/camera.js";
  import { selectPass, shotData } from "./_shared/layers/shot.js";
  import { mountPlate } from "./_shared/layers/plate.js";
  import { mountCursor } from "./_shared/layers/cursor.js";
  import { collapseRows, flipReorder, ringPulse } from "./_shared/layers/ui.js";
  const ID = "D03-ui";
  const DATA_ID = "S07";
  const { pass, mode } = window.__hyperframes.getVariables();
  const { timing, cam } = shotData(DATA_ID, mode);
  const roots = selectPass(ID, pass);
  const mid = document.querySelector("#D03-ui-mid .cam");
  const tl = gsap.timeline({ paused: true });

  const plate = await mountPlate(mid, { id: "_fixture" });
  plate.enter(tl, 0.2, { from: "right" });

  const rows = [];
  for (let i = 1; i <= 6; i++) {
    plate.mask("row-" + i);
    const slot = plate.overlay("row-" + i);
    const row = document.createElement("div");
    row.className = "d03-row";
    row.textContent = "row " + i;
    slot.appendChild(row);
    rows.push(slot);
  }
  collapseRows(tl, [rows[1], rows[3], rows[4]], 1.0);
  flipReorder(tl, rows, [0, 2, 1, 3, 5, 4], 1.6);

  const btn = plate.box("btn");
  const cursor = mountCursor(mid);
  cursor.show(tl, 1.7);
  cursor.path(tl, [
    { t: 1.8, x: 280, y: 240 },
    { t: 2.5, x: btn.x + btn.w / 2, y: btn.y + btn.h / 2 },
  ]);
  cursor.click(tl, 2.6);
  ringPulse(tl, mid, plate.box("row-1"), 3.0);

  applyCamera(tl, cam, roots, timing.duration);
  tl.set({}, {}, timing.duration);
  window.__timelines = window.__timelines || {};
  window.__timelines[ID] = tl;
</script>
</body>
</html>
