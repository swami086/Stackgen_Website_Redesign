<!doctype html>
<html data-composition-variables='[{"id":"pass","type":"string","label":"Pass: bg|mid|fg|all","default":"all"},{"id":"mode","type":"string","label":"Edit: full|cut","default":"full"}]'>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_shared/tokens/brand.css">
<link rel="stylesheet" href="_shared/layers/layers.css">
<link rel="stylesheet" href="_shared/layers/ui.css">
<link rel="stylesheet" href="_shared/layers/type.css">
<style>
  @font-face { font-family: "Geist"; src: url("_shared/assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("_shared/assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
  body { margin: 0; font-family: "Geist", sans-serif; color: var(--sg-cream); }
  .sg-support .sg-mask {
    position: static;
    background: transparent;
    display: inline-block;
    overflow: hidden;
  }
  .s18-kicker {
    position: absolute;
    left: 48px;
    top: 36px;
    font-family: "Geist Mono", monospace;
    font-size: 18px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--sg-mute);
    border-radius: 0;
  }
  .s18-title {
    position: absolute;
    left: 48px;
    top: 68px;
    font-family: "Geist", sans-serif;
    font-size: 40px;
    line-height: 1.1;
    color: var(--sg-cream);
    border-radius: 0;
  }
  .s18-action {
    position: absolute;
    left: 48px;
    top: 168px;
    width: 1584px;
    height: 72px;
    box-sizing: border-box;
    font-family: "Geist", sans-serif;
    font-size: 32px;
    line-height: 72px;
    color: var(--sg-cream);
    border-radius: 0;
    white-space: nowrap;
  }
  .s18-options {
    position: absolute;
    left: 48px;
    top: 268px;
    font-family: "Geist Mono", monospace;
    font-size: 16px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--sg-mute);
    border-radius: 0;
  }
  .s18-chip {
    position: absolute;
    top: 308px;
    height: 64px;
    box-sizing: border-box;
    border: 1px solid var(--sg-hairline);
    background: var(--sg-ink);
    color: var(--sg-cream);
    font-family: "Geist Mono", monospace;
    font-size: 24px;
    line-height: 64px;
    padding: 0 20px;
    border-radius: 0;
    white-space: nowrap;
    outline: 2px solid transparent;
    outline-offset: 0;
  }
  .s18-chip.is-lit { border-color: var(--sg-violet); color: var(--sg-violet); }
</style>
<script src="_shared/vendor/gsap.min.js"></script>
<script src="_shared/build/data.js"></script>
</head>
<body>
<div id="root" data-composition-id="S18" data-width="1920" data-height="1080">
  <div id="S18-bg" class="pass pass-bg"></div>
  <div id="S18-mid" class="pass pass-mid"><div class="cam"></div></div>
  <div id="S18-fg" class="pass pass-fg"><div class="cam"></div></div>
</div>
<script type="module">
  import { applyCamera } from "./_shared/layers/camera.js";
  import { cueT, selectPass, shotData } from "./_shared/layers/shot.js";
  import { mountRibbons } from "./_shared/layers/ribbons.js";
  import { mountPlate } from "./_shared/layers/plate.js";
  import { mountType } from "./_shared/layers/type.js";

  const ID = "S18";
  const DATA_ID = "S18";
  const ACTION = "Roll back checkout-svc to previous version";
  const KEYS = ["action-row", "opt-restart", "opt-scale", "opt-reroute", "opt-rollback"];
  const { pass, mode } = window.__hyperframes.getVariables();
  const { meta, timing, cam } = shotData(DATA_ID, mode);
  const roots = selectPass(ID, pass);
  const bg = document.getElementById("S18-bg");
  const mid = document.querySelector("#S18-mid .cam");
  const fg = document.querySelector("#S18-fg .cam");
  const tl = gsap.timeline({ paused: true });

  document.getElementById("root").dataset.duration = String(timing.duration);
  const D = timing.duration;

  mountRibbons(bg, {
    seed: meta.seed,
    count: 16,
    modes: [{ t: 0, mode: "dormant", opacity: 0.45 }],
  }).bind(tl, D);
  bg.querySelector("canvas").setAttribute("data-layout-allow-overflow", "");

  const chips = {};
  let plateMock = false;
  const labels = {
    "opt-restart": "Restart",
    "opt-scale": "scale",
    "opt-reroute": "reroute traffic",
    "opt-rollback": "roll back",
  };

  function fillAction(host, positioned) {
    const text = document.createElement("div");
    if (positioned) text.className = "s18-action";
    text.textContent = ACTION;
    host.appendChild(text);
  }

  try {
    const plate = await mountPlate(mid, { id: "P10", x: 120, y: 90, width: 1680 });
    for (const key of KEYS) plate.box(key);
    const action = plate.overlay("action-row");
    fillAction(action, true);
    for (const key of Object.keys(labels)) {
      const host = plate.overlay(key);
      const chip = document.createElement("div");
      chip.className = "s18-chip";
      chip.style.left = "0";
      chip.style.top = "0";
      if (key === "opt-restart" || key === "opt-scale") chip.classList.add("is-lit");
      chip.textContent = labels[key];
      host.appendChild(chip);
      chips[key] = chip;
    }
  } catch (err) {
    plateMock = true;
    const panel = document.createElement("div");
    panel.className = "sg-plate";
    panel.dataset.plate = "P10";
    panel.dataset.mock = "true";
    panel.style.left = "120px";
    panel.style.top = "90px";
    panel.style.width = "1680px";
    panel.style.height = "945px";
    const kicker = document.createElement("div");
    kicker.className = "s18-kicker";
    kicker.textContent = "Governed action";
    panel.appendChild(kicker);
    const heading = document.createElement("div");
    heading.className = "s18-title";
    heading.textContent = "Remediation";
    panel.appendChild(heading);
    const action = document.createElement("div");
    action.className = "s18-action";
    action.dataset.key = "action-row";
    action.textContent = ACTION;
    panel.appendChild(action);
    const options = document.createElement("div");
    options.className = "s18-options";
    options.textContent = "Options";
    panel.appendChild(options);
    const spec = [
      ["opt-restart", "Restart", 48, 280, true],
      ["opt-scale", "scale", 360, 220, true],
      ["opt-reroute", "reroute traffic", 612, 360, false],
      ["opt-rollback", "roll back", 1004, 280, false],
    ];
    for (const [key, label, x, w, lit] of spec) {
      const chip = document.createElement("div");
      chip.className = "s18-chip" + (lit ? " is-lit" : "");
      chip.dataset.key = key;
      chip.style.left = x + "px";
      chip.style.width = w + "px";
      chip.textContent = label;
      panel.appendChild(chip);
      chips[key] = chip;
    }
    mid.appendChild(panel);
  }

  const tReroute = cueT(timing, "reroute traffic");
  const tRollback = cueT(timing, "roll back");
  tl.to(chips["opt-reroute"], {
    borderColor: "var(--sg-violet)", color: "var(--sg-violet)", duration: 0.18, ease: "power4.out",
  }, tReroute);
  tl.to(chips["opt-rollback"], {
    borderColor: "var(--sg-violet)",
    color: "var(--sg-violet)",
    outlineColor: "var(--sg-violet)",
    duration: 0.18,
    ease: "power4.out",
  }, tRollback);

  const type = mountType(fg);
  type.fromOst(tl, timing.ost, { support: { x: 136, y: 960, inline: true } });
  const line = fg.querySelector(".sg-support");
  if (line) {
    const prefix = document.createDocumentFragment();
    for (const word of ["Restart", "scale"]) {
      if (prefix.childNodes.length) {
        const sep = document.createElement("span");
        sep.className = "sg-sep";
        sep.textContent = " · ";
        prefix.appendChild(sep);
      }
      const span = document.createElement("span");
      span.textContent = word;
      prefix.appendChild(span);
    }
    const tail = document.createElement("span");
    tail.className = "sg-sep";
    tail.textContent = " · ";
    prefix.appendChild(tail);
    line.insertBefore(prefix, line.firstChild);
    line.setAttribute("aria-label", "Restart · scale · " + (line.getAttribute("aria-label") || ""));
    line.setAttribute("data-layout-allow-overlap", "");
    line.setAttribute("data-layout-allow-caption-zone", "");
  }

  applyCamera(tl, cam, roots, D);
  tl.set({}, {}, D);
  window.__timelines[ID] = tl;
  if (!plateMock && !chips["opt-rollback"]) throw new Error("P10 chips missing");
</script>
</body>
</html>
