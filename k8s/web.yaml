# StackGen website — GKE Standard, 1 node, us-west1-b
# Cluster: stackgen-web (propane-galaxy-498403-n8). Reuse; do not create another.
# Image: us-west1-docker.pkg.dev/propane-galaxy-498403-n8/stackgen-web/web:<tag>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stackgen-web
  labels:
    app: stackgen-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stackgen-web
  template:
    metadata:
      labels:
        app: stackgen-web
    spec:
      containers:
        - name: web
          image: us-west1-docker.pkg.dev/propane-galaxy-498403-n8/stackgen-web/web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: stackgen-web
  labels:
    app: stackgen-web
spec:
  type: LoadBalancer
  selector:
    app: stackgen-web
  ports:
    - name: http
      port: 80
      targetPort: http
