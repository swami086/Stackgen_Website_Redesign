<!DOCTYPE html>
<html data-composition-variables="[{&quot;id&quot;:&quot;pass&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Pass: bg|mid|fg|all&quot;,&quot;default&quot;:&quot;all&quot;},{&quot;id&quot;:&quot;mode&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Edit: full|cut&quot;,&quot;default&quot;:&quot;full&quot;}]">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_shared/tokens/brand.css">
<link rel="stylesheet" href="_shared/layers/layers.css">
<link rel="stylesheet" href="_shared/layers/ui.css">
<link rel="stylesheet" href="_shared/layers/type.css">
<style>
  @font-face { font-family: "Geist"; src: url("_shared/assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("_shared/assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
  body { margin: 0; font-family: "Geist", sans-serif; color: var(--sg-cream); }
  .sg-support .sg-mask {
    position: static;
    background: transparent;
    display: inline-block;
    overflow: hidden;
  }
  .s19-kicker, .s19-title, .s19-action, .s19-logcap, .s19-prior {
    position: absolute; border-radius: 0; white-space: nowrap;
  }
  .s19-kicker, .s19-logcap, .s19-prior, .s19-gate, .s19-audit {
    font-family: "Geist Mono", monospace;
  }
  .s19-kicker {
    left: 64px; top: 52px; font-size: 15px; letter-spacing: 0.14em;
    color: var(--sg-mute);
  }
  .s19-title {
    left: 64px; top: 84px; font-family: "Geist", sans-serif;
    font-size: 36px; font-weight: 400; color: var(--sg-cream);
  }
  .s19-action {
    left: 64px; top: 148px; font-family: "Geist", sans-serif;
    font-size: 22px; color: var(--sg-cream);
  }
  .s19-logcap {
    left: 64px; top: 520px; font-size: 15px; letter-spacing: 0.16em; color: var(--sg-mute);
  }
  .s19-prior {
    left: 64px; font-size: 18px; line-height: 36px; color: var(--sg-mute);
  }
  .s19-prior.is-a { top: 560px; }
  .s19-prior.is-b { top: 596px; }
  .s19-slot { position: absolute; box-sizing: border-box; border-radius: 0; }
  .s19-btn, .s19-gate, .s19-audit {
    box-sizing: border-box; border-radius: 0; width: 100%; height: 100%;
  }
  .s19-btn {
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--sg-hairline);
    font-family: "Geist", sans-serif; font-size: 18px;
  }
  .s19-gate {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 0 16px;
    border: 1px solid var(--sg-hairline);
    font-size: 16px; color: var(--sg-cream);
  }
  .s19-gate svg { display: block; flex: none; overflow: visible; }
  .s19-audit {
    font-size: 18px; line-height: 36px; color: var(--sg-cream);
    white-space: nowrap; overflow: hidden;
  }
</style>
<script src="_shared/vendor/gsap.min.js"></script>
<script src="_shared/build/data.js"></script>
</head>
<body>
<div data-hf-id="hf-c0ne" id="root" data-composition-id="S19" data-width="1920" data-height="1080">
  <div data-hf-id="hf-4b4b" id="S19-bg" class="pass pass-bg"></div>
  <div data-hf-id="hf-91vj" id="S19-mid" class="pass pass-mid"><div data-hf-id="hf-12x1" class="cam"></div></div>
  <div data-hf-id="hf-v5wb" id="S19-fg" class="pass pass-fg"><div data-hf-id="hf-wcpl" class="cam"></div></div>
</div>
<script type="module">
  import { applyCamera } from "./_shared/layers/camera.js";
  import { cueT, selectPass, shotData } from "./_shared/layers/shot.js";
  const ID = "S19";
  const DATA_ID = "S19";
  const SVGNS = "http://www.w3.org/2000/svg";
  const AUDIT = "10:42:07  aiden  rollback checkout-svc → v1.41.2  approved by s.patel";
  const { pass, mode } = window.__hyperframes.getVariables();
  const { meta, timing, cam } = shotData(DATA_ID, mode);
  const roots = selectPass(ID, pass);
  const bg = document.getElementById("S19-bg");
  const mid = document.querySelector("#S19-mid .cam");
  const fg = document.querySelector("#S19-fg .cam");
  const tl = gsap.timeline({ paused: true });

  document.getElementById("root").dataset.duration = String(timing.duration);
  const D = timing.duration;
  const { mountRibbons } = await import("./_shared/layers/ribbons.js");
  const { mountPlate } = await import("./_shared/layers/plate.js");
  const { mountCursor } = await import("./_shared/layers/cursor.js");
  const { drawPath, typewriter } = await import("./_shared/layers/ui.js");
  const { mountType } = await import("./_shared/layers/type.js");

  mountRibbons(bg, {
    seed: meta.seed,
    count: 16,
    modes: [{ t: 0, mode: "dormant", opacity: 0.45 }],
  }).bind(tl, D);
  const ribbonCanvas = bg.querySelector("canvas");
  if (ribbonCanvas) ribbonCanvas.setAttribute("data-layout-allow-overflow", "");

  const tApprove = cueT(timing, "Approval gate");
  const tGate = tApprove + 0.25;
  const tAudit = cueT(timing, "full audit trail");

  function text(tag, cls, value) {
    const node = document.createElement(tag);
    node.className = cls;
    node.textContent = value;
    return node;
  }

  function fillButton(host) {
    host.dataset.key = "approve-btn";
    const face = document.createElement("div");
    face.className = "s19-btn";
    const label = document.createElement("div");
    label.textContent = "Approve";
    face.appendChild(label);
    host.appendChild(face);
    gsap.set(face, { backgroundColor: "#211D15" });
    gsap.set(label, { color: "#F1EAE0" });
    return { face, label };
  }

  function fillGate(host) {
    host.dataset.key = "gate-policy";
    const face = document.createElement("div");
    face.className = "s19-gate";
    face.appendChild(text("div", "", "prod-change gate"));
    const svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("width", "20");
    svg.setAttribute("height", "20");
    svg.setAttribute("viewBox", "0 0 20 20");
    const path = document.createElementNS(SVGNS, "path");
    path.setAttribute("d", "M4 10.5 L8.2 15 L16 5.5");
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#A6F0BF");
    path.setAttribute("stroke-width", "1.5");
    svg.appendChild(path);
    face.appendChild(svg);
    host.appendChild(face);
    gsap.set(face, { borderColor: "#3F3B39" });
    return { face, path };
  }

  function fillAudit(host) {
    host.dataset.key = "audit-line-last";
    const line = document.createElement("div");
    line.className = "s19-audit";
    host.appendChild(line);
    return line;
  }

  function mockPanel() {
    const panel = document.createElement("div");
    panel.className = "sg-plate";
    panel.dataset.plate = "P11";
    panel.dataset.mock = "1";
    panel.style.left = "120px";
    panel.style.top = "90px";
    panel.style.width = "1680px";
    panel.style.height = "945px";
    panel.appendChild(text("div", "s19-kicker", "REMEDIATION"));
    panel.appendChild(text("div", "s19-title", "Rollback needs approval"));
    panel.appendChild(text("div", "s19-action", "Roll back checkout-svc to previous version"));
    panel.appendChild(text("div", "s19-logcap", "AUDIT"));
    panel.appendChild(text("div", "s19-prior is-a", "10:41:02  aiden  proposed rollback checkout-svc → v1.41.2"));
    panel.appendChild(text("div", "s19-prior is-b", "10:41:44  policy  prod-change gate armed"));
    const approve = document.createElement("div");
    approve.className = "s19-slot";
    approve.style.left = "1180px";
    approve.style.top = "228px";
    approve.style.width = "248px";
    approve.style.height = "56px";
    const gate = document.createElement("div");
    gate.className = "s19-slot";
    gate.style.left = "64px";
    gate.style.top = "228px";
    gate.style.width = "380px";
    gate.style.height = "56px";
    const audit = document.createElement("div");
    audit.className = "s19-slot";
    audit.style.left = "64px";
    audit.style.top = "648px";
    audit.style.width = "1552px";
    audit.style.height = "36px";
    panel.appendChild(approve);
    panel.appendChild(gate);
    panel.appendChild(audit);
    mid.appendChild(panel);
    return {
      approve,
      gate,
      audit,
      tip: { x: 120 + 1180 + 124, y: 90 + 228 + 28 },
    };
  }

  let slots = null;
  try {
    const plate = await mountPlate(mid, { id: "P11", x: 120, y: 90, width: 1680 });
    plate.mask("approve-btn");
    plate.mask("gate-policy");
    plate.mask("audit-line-last");
    const approveBox = plate.box("approve-btn");
    slots = {
      approve: plate.overlay("approve-btn"),
      gate: plate.overlay("gate-policy"),
      audit: plate.overlay("audit-line-last"),
      tip: {
        x: approveBox.x + approveBox.w / 2,
        y: approveBox.y + approveBox.h / 2,
      },
    };
  } catch (err) {
    const stray = mid.querySelector(".sg-plate");
    if (stray) stray.remove();
    slots = mockPanel();
    slots.reason = err instanceof Error ? err.message : String(err);
  }

  const button = fillButton(slots.approve);
  const gate = fillGate(slots.gate);
  const auditLine = fillAudit(slots.audit);

  const paint = { p: 0 };
  tl.to(paint, {
    p: 1,
    duration: D,
    ease: "none",
    onUpdate: () => {
      button.label.textContent = paint.p * D >= tApprove ? "Approved" : "Approve";
    },
  }, 0);
  tl.to(button.face, { backgroundColor: "#FAF7F2", duration: 0.18, ease: "power2.out" }, tApprove);
  tl.to(button.label, { color: "#14110C", duration: 0.18, ease: "power2.out" }, tApprove);
  tl.to(gate.face, { borderColor: "#A6F0BF", duration: 0.25, ease: "power2.out" }, tGate);
  drawPath(tl, gate.path, tGate, 0.25);
  typewriter(tl, auditLine, AUDIT, tAudit, { cps: 50 });

  const cursor = mountCursor(mid);
  cursor.show(tl, 0.2);
  cursor.path(tl, [
    { t: 0.2, x: slots.tip.x - 440, y: slots.tip.y - 150 },
    { t: tApprove - 0.15, x: slots.tip.x, y: slots.tip.y },
  ]);
  cursor.click(tl, tApprove);

  mountType(fg).fromOst(tl, timing.ost, { support: { x: 192, y: 960, inline: true } });
  const support = fg.querySelector(".sg-support");
  if (support) {
    support.setAttribute("data-layout-allow-overflow", "");
    support.setAttribute("data-layout-allow-overlap", "");
    support.setAttribute("data-layout-allow-caption-zone", "");
  }

  applyCamera(tl, cam, roots, D);
  tl.set({}, {}, D);
  window.__timelines[ID] = tl;
</script>
</body>
</html>
